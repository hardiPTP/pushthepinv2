<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Push the Pin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── tokens, all taken from the Figma file ───────────────────────────── */
:root{
  --paper:#FBFAF7; --card:#FFFFFF;
  --ink:#17130F; --body:#3A342C; --mid:#6E6E6E; --mute:#9E9A94; --faint:#B0AAA0;
  --line:#E9E5DE; --edge:#C7B99F; --dash:#B5B0A8; --dead:#EDE9E1; --deadink:#A29C92;
  --green:#2E7D4F; --greenInk:#256B42;
  --red:#C42B1C; --redInk:#B02618;
  /* Cobalt is the accent. It is dark where the old accent was light, so anything
     sitting on a cobalt fill is white, and anything cobalt sitting on paper is
     --blueInk. Measured: white on --blue 8.44:1, --blueInk on paper 12.21:1. */
  --blue:#0047AB; --blueDeep:#003A8C; --blueInk:#00306E;
  --blueSoft:#E4ECFB; --blueEdge:#BCD2F0; --blueLift:#A9C6FF;
  --onBlueGreen:#86E2AE; --onBlueRed:#FFA396;
  /* --ward is no longer the brand hue, so it now means one thing only: the ward
     is working on it. --warn stays the issue orange. */
  --ward:#B87A0A; --warn:#E07B00; --warnBg:#FBEAD8;
  --r-card:20px; --r-photo:16px; --r-field:16px; --r-sheet:24px; --r-chip:14px;
  --shadow:0 1px 1px rgba(0,0,0,.10), 0 1px 1.5px rgba(0,0,0,.02);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:#EDEAE4; font-family:'Schibsted Grotesk',system-ui,sans-serif;
  color:var(--ink); display:flex; align-items:center; justify-content:center;
  padding:24px; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;width:100%}

/* ── phone frame ─────────────────────────────────────────────────────── */
#phone{
  width:390px; height:844px; background:var(--paper); position:relative;
  border-radius:44px; overflow:hidden; flex:0 0 auto;
  box-shadow:0 0 0 10px #191713, 0 26px 60px rgba(0,0,0,.28);
}
#app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;z-index:2;padding-top:max(14px,env(safe-area-inset-top))}
#lmap{position:absolute;inset:0;display:none;z-index:1;background:var(--line);cursor:grab}
#lmap.on{display:block}
#app.overmap{background:transparent;pointer-events:none}
#app.overmap > *{pointer-events:auto}
#app.overmap .mapgap{flex:1;pointer-events:none}
.mrk{width:34px;height:34px;border-radius:999px;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(23,20,15,.28)}
.mrk.sel{box-shadow:0 0 0 4px rgba(0,71,171,.35), 0 3px 8px rgba(23,20,15,.3)}
.mapcard{position:absolute;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:22;
  background:#fff;border-radius:var(--r-card);border:1px solid var(--line);box-shadow:0 10px 26px rgba(23,20,15,.14);
  padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ── status bar ──────────────────────────────────────────────────────── */
.sbar{height:52px;display:flex;align-items:center;padding:18px 22px 0 26px;flex:0 0 auto;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sbar b{font-size:15.5px;letter-spacing:-.2px}
.sbar .sp{flex:1}
.sbar .bars{display:flex;gap:1.7px;align-items:flex-end}
.sbar .bars i{width:3px;background:var(--ink);border-radius:1px;display:block}
.batt{width:27px;height:13px;position:relative;margin-left:7px}
.batt u{position:absolute;left:0;top:0;width:25px;height:13px;border:1.2px solid var(--ink);opacity:.4;border-radius:4px}
.batt s{position:absolute;left:2.5px;top:2.5px;width:19px;height:8px;background:var(--ink);border-radius:2.5px}

/* ── type ────────────────────────────────────────────────────────────── */
.h1{font-size:24px;line-height:34px;font-weight:700;letter-spacing:-.2px}
.h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.4px}
.h3{font-size:18.5px;line-height:25px;font-weight:700;letter-spacing:-.2px}
.subhead{font-size:16px;line-height:22px;font-weight:700;letter-spacing:-.4px}
.body{font-size:14px;line-height:20px;color:var(--body)}
.bodyStrong{font-size:14px;line-height:20px;font-weight:700;letter-spacing:-.2px}
.meta{font-size:12px;line-height:17px;color:var(--mid)}
.metaQ{font-size:12px;line-height:17px;color:var(--mute)}
.small{font-size:11px;line-height:15px;color:var(--mute)}
.mid{color:var(--mid)} .mute{color:var(--mute)} .ink{color:var(--ink)}

/* ── shared chrome ───────────────────────────────────────────────────── */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;flex:0 0 auto;background:var(--paper)}
.circbtn{width:38px;height:38px;border-radius:999px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.avatar{border-radius:999px;object-fit:cover;flex:0 0 auto;background:var(--line)}
.pill{border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-weight:700}
.btn-dark{background:var(--ink);color:#fff;border-radius:999px;padding:17px 20px;display:flex;
  align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700;width:100%}
.btn-blue{background:var(--blue);color:#fff;border-radius:999px;padding:15px 20px;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;width:100%}
.btn-ghost{background:#fff;border:1px solid var(--line);border-radius:999px;padding:15px 20px;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;width:100%}
.btn-dark[disabled],.btn-blue[disabled]{background:var(--dead);color:var(--deadink);cursor:default}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.rule{height:1px;background:var(--line);width:100%}
.tapfx:active{opacity:.62}

/* ── bottom bar ──────────────────────────────────────────────────────── */
.dock{position:absolute;left:0;right:0;bottom:0;pointer-events:none;z-index:20;
  padding:0 0 calc(26px + env(safe-area-inset-bottom))}
.dock>*{pointer-events:auto}
.bottombar{margin:0 auto;background:#fff;border-radius:999px;padding:7px;display:flex;gap:6px;
  width:max-content;filter:drop-shadow(0 6px 4.5px rgba(23,20,15,.07))}
.tab{border:1px solid var(--blueEdge);border-radius:999px;padding:12px;display:flex;align-items:center;gap:8px}
.tab.on{background:var(--blueSoft);border-color:var(--blueSoft);padding:12px 18px}
.tab b{font-size:14px;letter-spacing:-.2px}
.addpin{position:absolute;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;
  background:var(--blue);display:flex;align-items:center;justify-content:center;z-index:20;
  box-shadow:0 6px 14px rgba(23,20,15,.14)}

/* ── feed ────────────────────────────────────────────────────────────── */
.feed{padding:14px 20px 150px;display:flex;flex-direction:column;gap:16px}
.scopes{display:flex;gap:8px}
.scope{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700}
.scope.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pincard{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:17px 16px 14px;display:flex;flex-direction:column}
.kicker{display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:17px}
.kicker .place{color:var(--mid)} .kicker .place b{color:var(--ink);font-weight:700}
.kicker .t{margin-left:auto;color:var(--mute);white-space:nowrap}
.byyou{background:var(--blueSoft);color:var(--blueInk);border-radius:999px;white-space:nowrap;flex:0 0 auto;
  padding:2px 9px;font-size:11px;font-weight:700;line-height:16px}
.byline{display:flex;align-items:center;gap:8px;font-size:12px;line-height:17px;color:var(--mid)}
.byline b{color:var(--ink)}
.photo{width:100%;border-radius:var(--r-photo);object-fit:cover;display:block;background:var(--line)}
.vchip{background:#EAF3EC;color:var(--greenInk);border-radius:999px;padding:3px 10px;
  font-size:11px;font-weight:700;display:inline-flex;gap:5px;align-items:center;line-height:16px}
.price{font-size:24px;line-height:31px;font-weight:700;letter-spacing:-.2px}
.pricenote{font-size:13px;color:var(--mute);font-weight:400}
.dateline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;line-height:20px}
.pollbox{border:1px solid var(--line);border-radius:var(--r-photo);padding:14px;display:flex;flex-direction:column;gap:8px}
.pollopt{background:#F7F5F0;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;
  font-size:13px;line-height:18px;position:relative;overflow:hidden}
.pollopt .fill{position:absolute;inset:0;background:var(--blueSoft);width:0}
.pollopt span{position:relative}
.pollopt.mine{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cardfoot{display:flex;align-items:center;gap:2px}
.react{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-size:13px;font-weight:700}
.react.on{background:var(--blueSoft)}
.react .n{color:var(--mid)} .react.on .n{color:var(--blueInk)}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.endfeed{text-align:center;color:var(--mute);font-size:14px;line-height:20px;padding:20px 0 0}

/* ── civic rail ──────────────────────────────────────────────────────── */
.rail{display:flex;align-items:center;gap:10px;width:100%}
.mk{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mk.done{background:var(--green);color:#fff}
.mk.alert{background:var(--red);color:#fff}
.mk.start{border:2.2px solid var(--ward);color:var(--ward)}
.mk.none{border:1.8px dashed var(--dash);color:var(--dash)}
.link{flex:1;height:1.5px;background:var(--line);border-radius:1px;min-width:0}
.railD{display:flex;align-items:flex-start;justify-content:center;width:100%}
.railD .cell{width:98px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.railD .mk{width:32px;height:32px}
.railD .cap{font-size:11px;line-height:15px;font-weight:700}
.railD .sub{font-size:10.5px;line-height:14px;color:var(--mute)}
.railD .link{margin-top:15px}
.statusline{font-size:13px;line-height:18px;color:var(--mid)}
.statusline b{color:var(--ink)}
.waitband{background:var(--blueSoft);border-radius:14px;padding:10px 10px 10px 14px;display:flex;
  align-items:center;gap:10px;justify-content:space-between}
.waitband .w{font-size:13px;font-weight:700;color:var(--blueInk)}
.waitband .b{background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}

/* ── vote ────────────────────────────────────────────────────────────── */
.votes{display:flex;gap:8px;width:100%}
.votes.compact{width:auto;flex:0 0 auto}
.votes.compact .vote{flex:0 0 auto;padding:8px 13px 8px 11px;font-size:12.5px;gap:6px}
.cardfoot{flex-wrap:nowrap}
.vote{flex:1 0 0;min-width:0;background:#fff;border:1.5px solid var(--blueEdge);border-radius:999px;
  padding:9.5px 16px 9.5px 14px;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;line-height:18px;font-weight:700;color:var(--body)}
.vote.mine{background:var(--blueDeep);border-color:var(--blueDeep);color:#fff}
.vote.pressed{background:#EEF3FC;border-color:var(--blue)}
.vote.mine .n.f{color:var(--onBlueGreen)} .vote.mine .n.nf{color:var(--onBlueRed)}
.vote.locked{opacity:.42}
.majority{display:flex;align-items:center;gap:5px;font-size:12px;line-height:17px;color:var(--mid)}
.majority b{color:var(--ink)}
.spin{width:18px;height:18px;border:2px solid rgba(0,71,171,.2);border-top-color:var(--blue);border-radius:999px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* ── sheets ──────────────────────────────────────────────────────────── */
.scrim{position:absolute;inset:0;background:rgba(23,19,15,.55);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);z-index:41;
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:0 20px 24px;max-height:88%;
  display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:3px;background:#D6D0C6;margin:8px auto 12px;flex:0 0 auto}
.sheetHead{display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;flex:0 0 auto}
.sheetHead .t{flex:1}
.xbtn{width:36px;height:36px;border-radius:999px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sheetBody{overflow-y:auto;flex:1;margin:0 -20px;padding:0 20px}
.sheetBody::-webkit-scrollbar{width:0}
.segs{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg{flex:1;border-radius:999px;padding:10px 6px;text-align:center;font-size:13px;font-weight:700;
  display:flex;gap:6px;align-items:center;justify-content:center}
.seg.on{background:var(--ink);color:#fff}
.seg .n{color:var(--mid)} .seg.on .n{color:var(--blueLift)}
.rows{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.row+.row{border-top:1px solid var(--line)}
.rows button.row{width:100%}
.row .c{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replychip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;display:flex;gap:5px;
  align-items:center;font-size:12px;font-weight:700}

/* ── composer ────────────────────────────────────────────────────────── */
.cHead{display:flex;align-items:center;gap:10px;height:58px;padding:10px 16px;flex:0 0 auto}
.cHead .road{display:flex;align-items:center;gap:5px;font-size:17px;line-height:23px;font-weight:700}
.cPost{border-radius:999px;padding:9px 17px;font-size:13.5px;font-weight:700;background:var(--dead);color:var(--deadink)}
.cPost.on{background:var(--blue);color:#fff}
.cBody{flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px}
.cBody::-webkit-scrollbar{width:0}
.cBody>*{flex:0 0 auto}
.cText{font-size:16px;line-height:23px;font-weight:400;color:var(--body);min-height:120px;
  outline:0;white-space:pre-wrap;word-break:break-word}
.cText::first-line{font-size:20px;line-height:27px;font-weight:700;letter-spacing:-.4px;color:var(--ink)}
.cText:empty::before{content:attr(data-ph);color:#A9A39A}
.cText:empty::first-line{font-size:20px;line-height:27px;letter-spacing:-.6px;color:#A9A39A}
.switchcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-field);
  padding:14px 16px;display:flex;align-items:center;gap:12px}
.switchcard.on{border-color:var(--warn);border-width:1.5px}
.switchcard.off{opacity:.5}
.sw{width:44px;height:26px;border-radius:999px;background:#DDD8CE;position:relative;flex:0 0 auto;transition:background .16s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;
  transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--warn)} .sw.on i{transform:translateX(18px)}
.sw.ev.on{background:var(--ink)}
.kindrow{display:flex;gap:8px;padding:12px 16px 0;background:var(--paper);flex:0 0 auto}
.kind{flex:1 0 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:12px 10px;font-size:13px}
.kind b{font-size:13px;white-space:nowrap}
.kind.on.issue{background:var(--warn);border-color:var(--warn);color:#fff}
.kind.on.event{background:var(--blue);border-color:var(--blue);color:#fff}
.kind.off{opacity:.42}
.chipdock{background:var(--paper);padding:12px 16px;display:flex;gap:8px;flex:0 0 auto}
.chip{flex:1 0 0;min-width:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-chip);
  height:59px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--mid)}
.chip b{font-size:11px;line-height:16px;color:var(--faint)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on b{color:#fff}
.chip.dead{opacity:.42}
.keyboard{height:291px;background:#D1CCC2;position:relative;flex:0 0 auto}
.keyboard i{position:absolute;background:#fff;border-radius:5px;height:42px}
.keyboard i.d{background:#ADA79C}
.keyboard u{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#8C877C}
.block{background:#fff;border:1px solid var(--line);border-radius:var(--r-field);padding:14px 16px;position:relative}
.block .x{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:999px;
  background:#EFEBE3;display:flex;align-items:center;justify-content:center;color:var(--mid)}
.block .lab{font-size:12px;line-height:17px;color:var(--mute)}
.typechips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.typechips::-webkit-scrollbar{height:0}
.tchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.tchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wardpanel{background:var(--warnBg);border-radius:var(--r-field);padding:14px 16px}
.wardpanel .t{color:var(--warn);font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.wardpanel .b{color:#8A5A22;font-size:12.5px;line-height:18px;margin-top:6px}
.reason{font-size:12px;line-height:17px;color:var(--redInk);display:flex;gap:6px;align-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:62px;height:62px;border-radius:10px;object-fit:cover}
.thumbadd{width:62px;height:62px;border-radius:10px;border:1.5px dashed var(--dash);
  display:flex;align-items:center;justify-content:center;color:var(--mute)}

/* ── calendar ────────────────────────────────────────────────────────── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dn{text-align:center;font-size:12px;color:var(--mute);padding:6px 0}
.cal button{height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:999px}
.cal button.on{background:var(--ink);color:#fff;font-weight:700}
.cal button[disabled]{color:#CFC9BF;cursor:default}
.timechips{display:flex;gap:8px}
.timechips button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 6px;
  text-align:center;font-size:13px;font-weight:700}
.timechips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ── notices, errors ─────────────────────────────────────────────────── */
.notice{border-radius:var(--r-field);padding:12px 14px;font-size:13px;line-height:18px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warnBg);color:#8A5A22}
.notice.flat{background:#F1EEE7;color:var(--mid)}
.notice b{color:var(--ink)}
.noticeAct{margin-left:auto;font-weight:700;color:var(--blueInk);white-space:nowrap}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#fff;
  border-radius:16px;padding:13px 16px;font-size:13px;line-height:18px;z-index:60;
  display:flex;gap:10px;align-items:center;animation:up .18s}
.toast .a{margin-left:auto;color:var(--blueLift);font-weight:700}
.pad{padding:0 20px}
.stack{display:flex;flex-direction:column}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 button{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.grid3 img{width:100%;height:100%;object-fit:cover;display:block}
.tick{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:999px;background:#fff;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tick.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ── dates ───────────────────────────────────────────────────────────── */
const D  = (y,m,d,h=9) => new Date(y,m-1,d,h).getTime();
const DAY = 864e5;
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDay  = t => { const d=new Date(t); return d.getDate()+' '+MON[d.getMonth()]; };
const fmtTime = t => { const d=new Date(t); let h=d.getHours(); const m=d.getMinutes(); const ap=h<12?'am':'pm'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; };
const fmtShort= t => { const d=new Date(t); return d.getDate()+' '+MON[d.getMonth()].slice(0,3); };
const days    = (a,b) => Math.floor((b-a)/DAY);
function ago(t){
  const m = Math.floor((S.now-t)/6e4);
  if (m<60) return Math.max(1,m)+'m';
  if (m<1440) return Math.floor(m/60)+'h';
  const d = Math.floor(m/1440);
  return d<8 ? d+'d' : fmtShort(t);
}
function eventLabel(p){
  const d = new Date(p.date), t = new Date(S.now);
  const same = d.toDateString()===t.toDateString();
  const hh = d.getHours(), mm = d.getMinutes();
  const time = (hh%12||12)+(mm?':'+String(mm).padStart(2,'0'):'')+' '+(hh<12?'am':'pm');
  if (same) return 'Tonight '+time;
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return wd+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)+', '+time;
}

/* ── the verification logic ──────────────────────────────────────────── */
/* Only answers after the ward's most recent action count toward the live
   split. Older answers stay in history and drop out of the sum.          */
function liveAnswers(p){ return S.answers.filter(a=>a.pinId===p.id && a.at>=(p.wardLast||0)); }
function histAnswers(p){ return S.answers.filter(a=>a.pinId===p.id && a.at< (p.wardLast||0)); }
function split(p){
  const live = liveAnswers(p);
  const fixed = live.filter(a=>a.value==='fixed').length;
  return {live, n:live.length, fixed, not:live.length-fixed};
}
/* Closing needs more agreement than staying open. */
function verdictAt(p){ const l=liveAnswers(p); return l.length?l.reduce((m,a)=>Math.max(m,a.at),0):S.now; }
function verdict(p){
  const {n,fixed,not} = split(p);
  if (n>=5 && fixed/n >= 0.70) return 'done';
  if (n>=3 && not > n/2)       return 'notdone';
  return null;
}
function voteOpen(p){
  if (p.kind!=='issue' || p.sendState!=='sent') return false;
  return !!p.ward.done || days(p.created, S.now) >= 7;
}
function dormant(p){
  if (!voteOpen(p)) return false;
  const last = S.answers.filter(a=>a.pinId===p.id).reduce((m,a)=>Math.max(m,a.at),0);
  return days(Math.max(last, p.wardLast||p.created), S.now) >= 30;
}
function civicState(p){
  if (p.sendState==='filed') return 'filed';
  const v = verdict(p);
  if (v==='done')    return 'done';
  if (v==='notdone') return 'notdone';
  if (p.ward.done)   return 'markeddone';
  if (p.ward.prog)   return 'inprogress';
  if (p.ward.ack)    return 'acknowledged';
  return 'sent';
}
/* Markers: complaint, ward, verification. Four renderings only. */
function markers(p){
  const st = civicState(p);
  const complaint = p.ward.ack ? 'done' : 'start';
  let ward = 'none';
  if (st==='notdone')      ward = 'none';       // reset, the pin goes back to the ward
  else if (p.ward.done)    ward = 'done';
  else if (p.ward.prog)    ward = 'start';
  const ver = st==='done' ? 'done' : st==='notdone' ? 'alert' : 'none';
  if (st==='filed') return {complaint:'start', ward:'none', ver:'none'};
  return {complaint, ward, ver};
}
const STATE_WORD = {filed:'Filed', sent:'Sent', acknowledged:'Acknowledged', inprogress:'In progress',
  markeddone:'Marked done', done:'Done', notdone:'Not done'};
function statusLine(p){
  const st = civicState(p);
  switch(st){
    case 'filed':       return ['Not sent yet', p.failReason==='ward' ? 'the ward system did not answer' : 'no signal when you posted it'];
    case 'sent':        return ['Sent', p.grievance ? 'grievance '+p.grievance : ''];
    case 'acknowledged':return ['Acknowledged', 'since '+fmtDay(p.ward.ack)];
    case 'inprogress':  return ['In progress', fmtDay(p.ward.prog)];
    case 'markeddone':  return ['Marked done', fmtDay(p.ward.done)];
    case 'done':        return ['Done', 'the road agreed'];
    case 'notdone':     return ['Not done', 'sent again '+fmtDay(verdictAt(p))];
  }
}
function myAnswer(p){ return S.answers.find(a=>a.pinId===p.id && a.userId==='me'); }
function replyCount(p){ return (p.replyBase||0) + S.comments.filter(c=>c.pinId===p.id && c.userId==='me').length; }

/* ── gates ───────────────────────────────────────────────────────────── */
/* Reading is never gated. Writing always is. */
function gate(run, label){
  if (S.auth==='out'){ S.intent={run,label}; S.wallSeen=true; S.sheets=[]; push({n:'wall'}); return false; }
  return true;
}
function runIntent(){
  const i = S.intent; S.intent=null;
  if (i) i.run();
}

/* ── actions ─────────────────────────────────────────────────────────── */
function answer(pinId, value){
  const p = pin(pinId);
  if (!gate(()=>{ push({n:'pin',id:pinId}); answer(pinId,value); }, (value==='fixed'?'Fixed':'Not fixed')+' on '+p.title)) return;
  const mine = myAnswer(p);
  if (mine && mine.value===value){                 // tapping your own answer clears it
    S.answers.splice(S.answers.indexOf(mine),1);
    render(); return;
  }
  const rec = mine || {pinId, userId:'me', road:S.currentRoad};
  rec.value = value; rec.at = S.now; rec.road = S.currentRoad; rec.pending = S.offline;
  if (!mine) S.answers.push(rec);
  render();
  if (S.offline){
    toast('Held. Your answer goes up when you are back on.', null);
  } else if (S.force==='votefail'){
    setTimeout(()=>{
      const i = S.answers.indexOf(rec); if (i>=0) S.answers.splice(i,1);
      toast('That did not go through. The count is back as it was.', {label:'Try again', fn:()=>answer(pinId,value)});
    }, 900);
  }
}
function reconcile(){
  const held = S.answers.filter(a=>a.pending);
  held.forEach(a=>a.pending=false);
  if (held.length) toast(held.length+' held answer'+(held.length>1?'s':'')+' went up.');
}
function support(pinId){
  const p = pin(pinId);
  if (!gate(()=>support(pinId), 'Support for '+p.title)) return;
  p.supported = !p.supported;
  p.supports += p.supported ? 1 : -1;
  render();
}
function interested(pinId){
  const p = pin(pinId);
  if (!gate(()=>interested(pinId), 'Interested in '+p.title)) return;
  p.interestedByMe = !p.interestedByMe;
  p.interested += p.interestedByMe ? 1 : -1;
  render();
}
function comment(pinId, text){
  if (!text.trim()) return;
  if (!gate(()=>comment(pinId,text), 'A reply on '+pin(pinId).title)) return;
  S.comments.push({pinId, userId:'me', at:S.now, text:text.trim()});
  S.commentDraft=''; render();
}
function retrySend(pinId){
  const p = pin(pinId);
  if (S.offline){ toast('Still no signal. Nothing has been sent.'); return; }
  if (S.force==='ward'){
    p.failReason='ward';
    toast('H West ward, MCGM did not answer. Your pin is here, nothing has been filed.', {label:'Try again', fn:()=>retrySend(pinId)});
    render(); return;
  }
  p.sendState='sent'; p.grievance=String(4400+Math.floor((S.now/DAY)%99));
  toast('Filed with H West ward. Grievance '+p.grievance+'.');
  render();
}
function wardAct(pinId, step){
  const p = pin(pinId); if (!p || p.kind!=='issue' || p.sendState!=='sent') return;
  if (step==='ack')  p.ward = {ack:S.now, prog:0, done:0};
  if (step==='prog') p.ward = {ack:p.ward.ack||S.now, prog:S.now, done:0};
  if (step==='done') p.ward = {ack:p.ward.ack||S.now, prog:p.ward.prog||S.now, done:S.now};
  p.wardLast = S.now;                                   // a new ward action restarts the count
  render();
}
function pinRoad(id){
  const r = road(id);
  if (!gate(()=>pinRoad(id), r.name+' on Home')) return;
  if (r.pinned) return;
  r.added = true;
  const pinned = S.roads.filter(x=>x.pinned);
  if (pinned.length>=4){ openSheet({n:'swap', id}); return; }
  r.pinned = true; render();
}
function advance(d){
  S.now += d*DAY;
  render();
}

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const a = (act, cls, inner, extra='') => `<button data-a="${act}" class="${cls}" ${extra}>${inner}</button>`;

function statusBar(){ return ''; }
function avatarEl(p, size){
  if (!p || !p.av) return `<span class="avatar" style="width:${size}px;height:${size}px;background:#E4DFD6;display:block"></span>`;
  return `<img class="avatar" style="width:${size}px;height:${size}px" src="${p.av}">`;
}
function mk(kind, glyph, size){
  const s = size||26, g = Math.round(s*0.54);
  return `<span class="mk ${kind}" style="width:${s}px;height:${s}px">${ic(glyph,g)}</span>`;
}
function railCompact(p){
  const m = markers(p);
  return `<div class="rail">${mk(m.complaint,'doc')}<span class="link"></span>${mk(m.ward,'bldg')}<span class="link"></span>${mk(m.ver, m.ver==='alert'?'excl':'ppl')}</div>`;
}
function railDetail(p){
  const m = markers(p), st = civicState(p);
  const sub = {
    complaint: p.sendState==='filed' ? 'Not sent' : (p.ward.ack ? 'Acknowledged, '+fmtShort(p.ward.ack) : 'Sent '+fmtShort(p.created)),
    ward: st==='notdone' ? 'Sent again' : p.ward.done ? 'Says done, '+fmtShort(p.ward.done)
          : p.ward.prog ? 'Working, '+fmtShort(p.ward.prog) : p.ward.ack ? 'Nothing yet' : 'Nothing yet',
    ver: st==='done' ? 'Road says yes' : st==='notdone' ? 'Road says no, '+fmtShort(verdictAt(p)) : voteOpen(p) ? 'Open to the road' : 'Not open yet',
  };
  const cell = (kind,glyph,cap,s) => `<div class="cell">${mk(kind,glyph,32)}
      <div><div class="cap">${cap}</div><div class="sub">${s}</div></div></div>`;
  return `<div class="railD">
    ${cell(m.complaint,'doc','Complaint',sub.complaint)}<span class="link"></span>
    ${cell(m.ward,'bldg','Ward',sub.ward)}<span class="link"></span>
    ${cell(m.ver, m.ver==='alert'?'excl':'ppl','Verification',sub.ver)}</div>`;
}
function voteRow(p, where){
  const {fixed,not} = split(p);
  const mine = myAnswer(p);
  const locked = false;                       // anyone can answer on any pin
  const b = (val,label,glyph,n) => {
    const on = mine && mine.value===val;
    return `<button data-a="vote:${p.id}:${val}" class="vote ${on?'mine':''} ${locked?'locked':''}">
      ${ic(glyph,15, on?'color:#fff':(val==='fixed'?'color:var(--green)':'color:var(--red)'))}
      <span>${label}</span><span class="n ${val==='fixed'?'f':'nf'}">${n}</span></button>`;
  };
  const total = fixed+not;
  let line;
  if (total===0) line = `<div class="majority mute">Nobody here has said yet</div>`;
  else if (total<5) line = `<div class="majority"><b>${fixed}</b> fixed <b>${not}</b> not fixed</div>`;
  else {
    const winner = not>fixed ? ['not fixed', not] : ['fixed', fixed];
    line = `<button data-a="wsw:${p.id}" class="majority"><b>${winner[1]}</b> people marked ${winner[0]} ${ic('chevron',11,'color:var(--mute)')}</button>`;
  }
  if (where==='row') return {votes:`${b('fixed','Fixed','tick',fixed)}${b('notfixed','Not fixed','cross',not)}`, line,
    note: mine ? `You said ${mine.value==='fixed'?'fixed':'not fixed'} on ${fmtShort(mine.at)}. Tap it again to take it back.${mine.pending?' Held until you are back on.':''}` : (dormant(p)?'Nobody has answered in thirty days.':'')};
  return `<div class="stack" style="gap:11px">
    <div class="votes">${b('fixed','Fixed','tick',fixed)}${b('notfixed','Not fixed','cross',not)}</div>
    ${line}
    ${mine ? `<div class="small">You said ${mine.value==='fixed'?'fixed':'not fixed'} on ${fmtShort(mine.at)}. Tap it again to take it back.${mine.pending?' Held until you are back on.':''}</div>`:''}
    ${dormant(p) ? `<div class="small">Nobody has answered in thirty days.</div>`:''}
  </div>`;
}

/* ── the pin card ────────────────────────────────────────────────────── */
function pinCard(p, opts={}){
  const r = road(p.road), au = p.anon ? null : person(p.author);
  const st = p.kind==='issue' ? civicState(p) : null;
  const mine = p.author==='me';
  const parts = [];

  parts.push(`<div class="kicker">
    <span class="place">${esc(r.name)}${p.spot?', '+esc(p.spot):''}</span>
    ${mine ? `<span class="byyou">by you</span>`:''}
    <span class="t">${p.kind==='event' && p.date ? esc(eventLabel(p)) : ago(p.created)}</span>
    ${opts.overflow!==false ? a('menu:'+p.id,'tapfx',ic('dots',18,'color:var(--mute)'),'style="margin-left:8px"') : ''}
  </div>`);

  parts.push(`<div class="h3" style="margin-top:7px;font-size:22px;line-height:28px;letter-spacing:-.4px">${esc(p.title)}</div>`);

  const bl = [];
  if (au) bl.push(`${avatarEl(au,24)}<b>${esc(au.name)}</b>`);
  else    bl.push(`${avatarEl(null,24)}<span>A neighbour</span>`);
  if (au && au.place) bl.push(`<span class="vchip">${ic('tick',11)}Verified by place</span>`);
  if (p.kind==='issue' && !p.anon){
    const ma = S.answers.find(x=>x.pinId===p.id && x.userId===p.author);
    if (ma) bl.push(`<span style="margin-left:auto;white-space:nowrap">said ${ma.value==='fixed'?'fixed':'not fixed'} on ${fmtShort(ma.at)}</span>`);
  }
  parts.push(`<div class="byline" style="margin-top:8px">${bl.join('')}</div>`);

  if (p.price) parts.push(`<div style="margin-top:10px" class="price">₹${p.price.value.toLocaleString('en-IN')}
    ${p.price.note?`<span class="pricenote"> ${esc(p.price.note)}</span>`:''}</div>`);

  if (p.text) parts.push(`<div class="body clamp" style="margin-top:8px">${esc(p.text)}</div>`);
  if (p.photos && p.photos.length) parts.push(`<img class="photo" style="margin-top:12px;height:168px" src="${p.photos[0]}">`);
  if (p.poll) parts.push(pollBlock(p, true));
  if (p.kind==='event' && p.date) parts.push(`<div class="dateline" style="margin-top:12px">${ic('calendar',16,'color:var(--blue)')}${esc(eventLabel(p))}</div>`);

  if (p.kind==='issue'){
    parts.push(`<div style="margin-top:15px">${railCompact(p)}</div>`);
    if (st==='sent' && voteOpen(p)) parts.push(`<div class="waitband" style="margin-top:14px">
        <span class="w">Waiting ${days(p.created,S.now)} days</span>
        ${a('share:'+p.id,'b', ic('share',15)+'Share')}</div>`);
    const [w,rest] = statusLine(p);
    parts.push(`<div class="statusline" style="margin-top:12px"><b>${w}</b>${rest?' '+esc(rest):''}
      ${st==='filed'? a('retry:'+p.id,'','<span style="color:var(--blueInk);font-weight:700;margin-left:8px">Send it now</span>') : ''}</div>`);
    parts.push(`<div class="rule" style="margin-top:13px"></div>`);
  } else {
    parts.push(`<div class="rule" style="margin-top:14px"></div>`);
  }

  const foot = [];
  const vr = (p.kind==='issue' && voteOpen(p)) ? voteRow(p,'row') : null;
  if (vr) foot.push(`<span class="votes compact">${vr.votes}</span><span style="flex:1"></span>`);
  if (p.kind==='issue') foot.push(`<button data-a="support:${p.id}" class="react ${p.supported?'on':''}">${ic('up',17)}${vr?'':'Support '}<span class="n">${p.supports}</span></button>`);
  if (p.kind==='event') foot.push(`<button data-a="interest:${p.id}" class="react ${p.interestedByMe?'on':''}">${p.interested} interested</button>`);
  foot.push(`<button data-a="open:${p.id}" class="react">${ic('comment',17)}${vr?'':'Comment '}<span class="n">${replyCount(p)}</span></button>`);
  parts.push(`<div class="cardfoot" style="margin-top:13px">${foot.join('')}</div>`);
  if (vr){
    parts.push(`<div class="rule" style="margin-top:13px"></div>`);
    parts.push(`<div style="margin-top:12px">${vr.line}${vr.note?`<div class="small" style="margin-top:6px">${esc(vr.note)}</div>`:''}</div>`);
  }

  return `<div class="pincard" data-a="open:${p.id}">${parts.join('')}</div>`;
}
function pollBlock(p, inCard){
  const total = p.poll.options.reduce((s,o)=>s+o.count,0) || 1;
  return `<div class="pollbox" style="margin-top:12px">
    <div class="bodyStrong">${esc(p.poll.q)}</div>
    ${p.poll.options.map((o,i)=>`<button data-a="pollvote:${p.id}:${i}" class="pollopt ${p.poll.mine===i?'mine':''}">
      <span class="fill" style="width:${p.poll.mine!=null?Math.round(o.count/total*100):0}%"></span>

    ${p.poll.closes?`<div class="small">Closes ${fmtDay(p.poll.closes)}</div>`:''}
  </div>`;
}

/* ── composer ────────────────────────────────────────────────────────── */
function newDraft(roadId){ return {road:roadId, text:'', photos:[], date:null, price:null, poll:null,
  issue:false, event:false, named:false, type:null, landmark:'', kbd:true}; }
function draftTitle(d){ return (d.text||'').split('\n')[0].trim(); }
function draftValid(d){
  if (!draftTitle(d)) return [false,''];
  if (d.event && !d.date) return [false,'An event needs a date. Add one to post.'];
  if (d.issue && !d.photos.length) return [false,'A report needs a photo.'];
  if (d.issue && !d.type) return [false,'Pick what the complaint is.'];
  return [true,''];
}

  const d = S.draft; const r = road(d.road);

  const chip = (k,glyph,label,dead,on) =>

      ${d.issue?`<div class="wardpanel"><div class="t">${ic('bldg',16,'color:var(--warn)')}H West ward, MCGM</div>
        <div class="b">Posting files a complaint and gives you a number you can check.</div></div>`:''}

    </div>
    <div class="kindrow">
      <button data-a="sw:issue" class="kind ${d.issue?'on issue':''} ${d.event?'off':''}">
        ${ic('warning',16, d.issue?'color:#fff':'color:var(--warn)')}<b>Raising an issue?</b></button>
      <button data-a="sw:event" class="kind ${d.event?'on event':''} ${d.issue?'off':''}">
        ${ic('calendar',16, d.event?'color:#fff':'color:var(--blueInk)')}<b>Or an event?</b></button>
    </div>
    <div class="chipdock">
      ${chip('photo','camera','Photo', false, d.photos.length>0)}
      ${chip('date','calendar','Schedule', d.issue, !!d.date)}
      ${chip('price','tag','Price', d.issue, !!d.price)}
      ${chip('poll','poll','Poll', d.issue, !!d.poll)}
    </div>
    ${d.kbd?`<div class="keyboard">${kbd()}</div>`:''}`;
}
function kbd(){
  let h='';
  for(let i=0;i<10;i++) h+=`<i style="left:${6+i*38.44}px;top:16px;width:32px"></i>`;
  for(let i=0;i<9;i++)  h+=`<i style="left:${21+i*39.5}px;top:68px;width:32px"></i>`;
  h+=`<i class="d" style="left:6px;top:120px;width:42px"></i>`;
  for(let i=0;i<7;i++)  h+=`<i style="left:${56+i*38}px;top:120px;width:32px"></i>`;
  h+=`<i class="d" style="left:342px;top:120px;width:42px"></i>`;
  h+=`<i class="d" style="left:6px;top:172px;width:44px"></i><i class="d" style="left:56px;top:172px;width:44px"></i>`;
  h+=`<i style="left:106px;top:172px;width:180px"></i><i class="d" style="left:292px;top:172px;width:92px"></i><u></u>`;
  return h;
}

/* ── a still map snippet for the pin ─────────────────────────────────── */
function tileURL(lat,lng,z){
  const n=Math.pow(2,z);
  const x=Math.floor((lng+180)/360*n);
  const la=lat*Math.PI/180;
  const y=Math.floor((1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n);
  const fx=((lng+180)/360*n)-x;
  const fy=((1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n)-y;
  return {url:`https://tile.openstreetmap.org/${z}/${x}/${y}.png`, fx, fy};
}
function locSnippet(p){
  const [lat,lng]=pinXY(p); const t=tileURL(lat,lng,16); const r=road(p.road);
  return `<div style="padding:16px 20px 0"><button data-a="pinmap:${p.id}" class="card" style="width:100%;overflow:hidden;display:block">
    <div style="position:relative;height:132px;background:var(--line)">
      <img src="${t.url}" style="position:absolute;width:420px;height:420px;left:50%;top:50%;
        transform:translate(-50%,-50%) translate(${Math.round((0.5-t.fx)*420)}px,${Math.round((0.5-t.fy)*420)}px);max-width:none">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);color:var(--blue)">${ic('place',34)}</span>
    </div>
    <div style="padding:13px 16px;display:flex;align-items:center;gap:10px">
      <span style="flex:1"><span class="bodyStrong" style="display:block;font-size:15px">${esc(r.name)}${p.spot?', '+esc(p.spot):''}</span>
      <span class="metaQ">${esc(r.address)}</span></span>
      ${ic('chevron',12,'color:var(--mute)')}</div></button></div>`;
}

function storyItems(){
  return S.pins.slice().sort((a,b)=>(b.wardLast||b.created)-(a.wardLast||a.created)).slice(0,8);
}
function storyHead(p){
  if (p.kind!=='issue') return p.title;
  const st = civicState(p), t=(p.type||'report').toLowerCase();
  const W=['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
  const sp = split(p);
  if (st==='filed')     return 'A '+t+' is waiting to send';
  if (st==='sent')      return 'A '+t+' was sent to the ward';
  if (st==='ack')       return 'A '+t+' was acknowledged';
  if (st==='prog')      return 'The ward started on a '+t;
  if (st==='done')      return 'The ward marked a '+t+' done';
  if (st==='verified')  return (W[sp.fixed]||sp.fixed)+' neighbours confirmed a fix';
  if (st==='notdone')   return (W[sp.not]||sp.not)+' neighbours said not fixed';
  return p.title;
}

/* ── map, OpenStreetMap ──────────────────────────────────────────────── */
const ROADXY={waterfield:[19.0604,72.8281],waroda:[19.0611,72.8272],chapel:[19.0618,72.8262],
  veronica:[19.0608,72.8265],hill:[19.0570,72.8290],nargis:[19.0490,72.8210],perry:[19.0640,72.8300],pali:[19.0662,72.8252]};
function nearestRoad(lat,lng){
  let best=null,bd=1e9;
  Object.keys(ROADXY).forEach(id=>{ if(!road(id)) return;
    const d=Math.hypot(ROADXY[id][0]-lat, ROADXY[id][1]-lng);
    if(d<bd){bd=d;best=id;} });
  return best;
}
function pinXY(p){ const b=ROADXY[p.road]||[19.0596,72.8295];
  const h=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0);
  return [b[0]+((h%13)-6)*0.00022, b[1]+((h%17)-8)*0.00022]; }
let MAP=null, MARKERS={};
const MCOL={issue:'var(--warn)',event:'var(--blue)',sale:'var(--ward)',ask:'var(--green)',place:'var(--ink)'};
const MICO={issue:'warning',event:'calendar',sale:'tag',ask:'q',place:'place'};
function initMap(){
  if (MAP) return;
  if (typeof L==='undefined'){ S.tileFail=true; return; }
  MAP=L.map('lmap',{zoomControl:false,attributionControl:true}).setView([19.0600,72.8278],16);
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
  let bad=0;
  tiles.on('tileerror',()=>{ bad++; if(bad>2 && !S.tileFail){ S.tileFail=true; render(); } });
  tiles.on('tileload',()=>{ if(S.tileFail){ S.tileFail=false; render(); } });
  tiles.addTo(MAP);
  L.control.zoom({position:'bottomleft'}).addTo(MAP);
  MAP.on('click',()=>{ if(S.mapPin){ S.mapPin=null; render(); } });
  setTimeout(()=>{ if(MAP) MAP.invalidateSize(); },120);
  setTimeout(()=>{ if(MAP) MAP.invalidateSize(); },400);
}
function drawMarkers(){
  if (!MAP) return;
  Object.keys(MARKERS).forEach(k=>MAP.removeLayer(MARKERS[k])); MARKERS={};
  if (S.mapPick) return;
  visiblePins().forEach(p=>{
    const sel = S.mapPin===p.id;
    const html = `<div class="mrk ${sel?'sel':''}" style="background:${MCOL[p.kind]||'var(--ink)'};color:#fff">${ic(MICO[p.kind]||'place',16)}</div>`;
    const m = L.marker(pinXY(p),{icon:L.divIcon({html, className:'', iconSize:[34,34], iconAnchor:[17,17]}), zIndexOffset: sel?1000:0}).addTo(MAP);
    m.on('click', e=>{ L.DomEvent.stopPropagation(e); S.mapPin=p.id; render(); MAP.panTo(pinXY(p),{animate:true}); });
    MARKERS[p.id]=m;
  });
}
function onMapMove(){
  if (!MAP || !S.mapPick) return;
  const c=MAP.getCenter(); const id=nearestRoad(c.lat,c.lng);
  if (id && id!==S.pickRoad){ S.pickRoad=id;
    const el=document.getElementById('pickroad'); if(el) el.textContent=road(id).name; }
}
function stepMap(dir){
  const l=visiblePins(); if(!l.length) return;
  let i=l.findIndex(p=>p.id===S.mapPin);
  i=(i+dir+l.length)%l.length;
  S.mapPin=l[i].id; render();
  if (MAP) MAP.flyTo(pinXY(l[i]), Math.max(MAP.getZoom(),16), {duration:.5});
}
function mapScreen(){
  const p = S.mapPin?pin(S.mapPin):null;
  const n = visiblePins().length;
  if (S.mapPick) return `<div class="header" style="background:var(--paper);border-bottom:1px solid var(--line)">
      ${a('mapcancel','circbtn tapfx',ic('close',17))}

    </div>

  return `<div class="header" style="background:var(--paper);border-bottom:1px solid var(--line)">
      ${a('back','circbtn tapfx',ic('back',18))}
      <div style="flex:1;margin-left:12px"><div class="subhead">Bandra West</div>
        <div class="meta">${n} pins on your roads</div></div>
      ${a('mappick:now','circbtn tapfx',ic('place',18))}</div>
    ${S.tileFail?`<div style="padding:10px 16px 0"><div class="notice warn">${ic('warning',16)}
      <div><b>The map needs a connection</b><br>Pins still show and still open.</div></div></div>`:''}
    <div class="mapgap"></div>
    ${p?`<div class="mapcard">
      <div class="kicker"><span class="place"><b>${esc(road(p.road).name)}</b>${p.spot?', '+esc(p.spot):''}</span>
        <span class="t">${ago(p.created)}</span></div>
      <div class="subhead" style="font-size:19px">${esc(p.title)}</div>
      ${p.kind==='issue'&&p.sendState==='sent'?railCompact(p):''}
      <div style="display:flex;align-items:center;gap:8px">
        ${a('mapstep:-1','circbtn tapfx',ic('back',16))}
        ${a('mapstep:1','circbtn tapfx',ic('back',16,'transform:rotate(180deg)'))}
        <span style="flex:1"></span>
        ${a('open:'+p.id,'pill','Open the pin','style="background:var(--blue);color:#fff;padding:11px 18px;font-size:14px"')}
      </div></div>`:''}
    ${bottomBar()}`;
}

    case 'wsw':   return wswSheet(s);

      <div class="sheetBody"><div class="rows">

    case 'roadpick': return roadPickSheet(s);

function dateSheet(){
  const d = S.dateSheet;
  const w = d.which || 'start';
  const poll = (w==='open'||w==='close');
  const cur = d[w] || {};
  const first = new Date(d.y, d.m, 1), lead = (first.getDay()+6)%7;
  const nd = new Date(d.y, d.m+1, 0).getDate();
  const floor = (w==='end'&&d.start&&d.start.day) ? new Date(d.y,d.m,d.start.day).getTime()
              : (w==='close'&&d.open&&d.open.day) ? new Date(d.y,d.m,d.open.day).getTime()
              : (()=>{const t=new Date(S.now);t.setHours(0,0,0,0);return t.getTime();})();
  let cells = '';
  for (let i=0;i<lead;i++) cells += '<span></span>';
  for (let n=1;n<=nd;n++){
    const t = new Date(d.y,d.m,n).getTime();
    cells += `<button data-a="calday:${n}" class="${cur.day===n?'on':''}" ${t<floor?'disabled':''}>${n}</button>`;
  }
  const tabs = poll ? [['open','Opens'],['close','Closes']] : [['start','Starts'],['end','Ends']];
  const times = poll ? ['9:00 am','6:00 pm','9:00 pm','Other'] : ['7:00 am','7:30 am','8:00 am','Other'];
  const say = k => d[k]&&d[k].day ? `${d[k].day} ${MON[d.m].slice(0,3)}, ${d[k].time||''}`.trim() : null;
  const line = poll
    ? (say('open')||'Opens now') + ' to ' + (say('close')||'no close')
    : (say('start')||'Pick a start') + (say('end')?' to '+say('end'):'');
  return `<div class="grab"></div>${sheetHead(poll?'When does it run?':'When is it?','')}
    <div class="sheetBody">
      <div class="segs" style="margin-bottom:14px">${tabs.map(t=>
        `<button data-a="calwhich:${t[0]}" class="seg ${w===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
      <div style="display:flex;align-items:center;margin-bottom:8px">
        <div class="subhead" style="font-size:17px">${MON[d.m]} ${d.y}</div><span style="flex:1"></span>
        ${a('calmon:-1','xbtn tapfx',ic('back',16))}
        <span style="width:8px"></span>
        ${a('calmon:1','xbtn tapfx',ic('back',16,'transform:rotate(180deg)'))}</div>
      <div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<span class="dn">${x}</span>`).join('')}${cells}</div>
      <div class="sectlabel" style="margin:16px 0 8px">Time</div>
      <div class="timechips">${times.map(t=>
        a('caltime:'+t,(cur.time===t?'on':''),t)).join('')}</div>
      <div style="margin-top:18px;padding-bottom:8px">
        <button data-a="caladd" class="btn-blue" ${(poll||(d.start&&d.start.day))?'':'disabled'}>${esc(line)}</button></div>
    </div>`;
}

/* ── root ────────────────────────────────────────────────────────────── */
function view(){
  if (S.loc==='asking') return statusBar()+locatingScreen();
  if (S.loc!=='granted' && !S.locResolved) return statusBar()+manualRoadScreen();
  const t = topR();
  let body;
  if (t.n==='tabs'){
    body = (S.tab==='home'?homeScreen():S.tab==='explore'?feedScreen():S.tab==='gather'?gatherScreen():searchScreen()) + bottomBar();
  }
  else if (t.n==='pin')      body = pinScreen(t.id);
  else if (t.n==='composer') return statusBar()+composerScreen()+sheetLayer();
  else if (t.n==='roads')    body = roadsScreen();
  else if (t.n==='addroad')  body = addRoadScreen();
  else if (t.n==='auth')     body = authScreen(t.which);
  else if (t.n==='wall')     body = wallScreen();
  else if (t.n==='roadcfg')  body = roadCfgScreen(t.id);
  else if (t.n==='map')      body = mapScreen();
  else if (t.n==='story')    return statusBar()+storyScreen()+(S.toast?toastView():'');
  else body = '';
  return statusBar()+body+sheetLayer()+(S.toast?toastView():'');
}
function sheetLayer(){
  const s = sheet(); if (!s) return '';
  return `<div class="scrim" data-a="sheetclose"></div><div class="sheet">${sheetView(s)}</div>`;
}
function toastView(){
  return `<div class="toast">${esc(S.toast.text)}
    ${S.toast.action?`<button data-a="toastact" class="a">${esc(S.toast.action.label)}</button>`:''}</div>`;
}

/* ── render, keeping focus ───────────────────────────────────────────── */
function render(){
  const act = document.activeElement;
  const key = act && act.dataset && act.dataset.in;
  const pos = act && act.selectionStart;
  const onMap = topR().n==='map' && S.loc==='granted';
  const mapEl=document.getElementById('lmap'), appEl=document.getElementById('app');
  mapEl.classList.toggle('on', onMap); appEl.classList.toggle('overmap', onMap);
  appEl.innerHTML = view();
  if (onMap) setTimeout(()=>{ initMap(); if(MAP){ MAP.invalidateSize(); drawMarkers(); } },30);
  renderDev();
  if (key){
    const el = document.querySelector(`[data-in="${key}"]`);
    if (el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
  }
}

/* ── input ───────────────────────────────────────────────────────────── */
document.addEventListener('input', e=>{
  const k = e.target.dataset.in; if (!k) return;
  const v = e.target.isContentEditable ? e.target.innerText.replace(/\n$/,'') : e.target.value;
  if (k==='text'){ S.draft.text=v; const [ok]=draftValid(S.draft);
    const b=document.querySelector('.cPost'); if(b){b.classList.toggle('on',ok); b.disabled=!ok;} return; }
  if (k==='comment'){ S.commentDraft=v;
    const b=document.querySelector('[data-a^="postcomment"]'); if(b) b.style.opacity = v.trim()?1:.35; return; }
  if (k==='landmark'){ S.draft.landmark=v; return; }
  if (k==='q'){ S.q=v; render(); return; }
  if (k==='roadq'){ S.roadq=v; render(); return; }
  if (k==='roadaddr'){ S.roadDraft.address=v; return; }
  if (k==='auth_phone'){ S.auth_phone=v; render(); return; }
  if (k==='auth_code'){ S.auth_code=v.replace(/\D/g,'').slice(0,6); render(); return; }
  if (k==='auth_name'){ S.auth_name=v; render(); return; }
  if (k==='pricev'){ S.priceSheet.v=v; render(); return; }
  if (k==='pollq'){ S.pollSheet.q=v; render(); return; }
  if (k.startsWith('pollo:')){ S.pollSheet.options[+k.split(':')[1]]=v; render(); return; }
});
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if (!el) return;
  const raw = el.dataset.a; if (!raw) return;
  e.stopPropagation();
  const [cmd, p1, p2] = raw.split(':');
  act(cmd, p1, p2);
});

function act(cmd, p1, p2){
  switch(cmd){
    case 'tab': S.tab=p1; S.stack=[{n:'tabs'}]; S.sheets=[]; return render();
    case 'open': S.sheets=[]; if(S.auth==='out') S.reads=(S.reads||0)+1; return push({n:'pin', id:p1});
    case 'back': {
      const wasPin = topR().n==='pin';
      pop();
      if (wasPin && S.auth==='out' && (S.reads||0)>=2 && !S.wallSeen){ S.wallSeen=true; push({n:'wall'}); }
      return; }
    case 'scope': S.scope=p1; return render();
    case 'roads': return push({n:'roads'});
    case 'addroad': return push({n:'addroad'});
    case 'signin': S.wallSeen=true; return push({n:'wall'});
    case 'menu': return openSheet({n:'menu', id:p1});
    case 'sheetclose': return closeSheet();
    case 'sheetback': return closeSheet();
    case 'toastact': { const f=S.toast.action.fn; S.toast=null; return f(); }
    case 'vote': return answer(p1,p2);
    case 'support': return support(p1);
    case 'interest': return interested(p1);
    case 'postcomment': return comment(p1, S.commentDraft||'');
    case 'retry': S.sheets=[]; return retrySend(p1);
    case 'share': return toast('Link copied.');
    case 'wsw': { const p=pin(p1); if (!liveAnswers(p).length) return; return openSheet({n:'wsw', id:p1, tab: split(p).not>split(p).fixed?'notfixed':'fixed'}); }
    case 'wswtab': { sheet().tab=p1; sheet().all=false; return render(); }
    case 'wswmore': { sheet().all=true; return render(); }
    case 'person': return openSheet({n:'person', pinId:sheet().id, userId:p1});
    case 'jump': { S.sheets=[]; render();
      const el=document.getElementById('c_'+p1+'_'+p2); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
      return toast('Jumped to that reply.'); }
    case 'pollvote': { const p=pin(p1); if(!gate(()=>act('pollvote',p1,p2), 'An answer on '+p.title)) return;
      const i=+p2; if(p.poll.mine!=null) p.poll.options[p.poll.mine].count--;
      if (p.poll.mine===i){ p.poll.mine=null; } else { p.poll.options[i].count++; p.poll.mine=i; }
      return render(); }

    /* location */
    case 'pickroad': S.locResolved=true; S.loc='denied'; S.currentRoad=null; return render();
    case 'readanyway': S.locResolved=true; return render();
    case 'retryloc': S.loc='asking'; startLocate(); return render();
    case 'setroad': S.currentRoad=p1; S.locResolved=true; return render();
    case 'road': S.currentRoad=p1; road(p1).opened=S.now; return render();

    /* auth */
    case 'go': S.sheets=[]; if(topR().n==='wall') S.stack.pop(); return push({n:'auth', which:p1});
    case 'wallno': S.intent=null; return pop();
    case 'map': S.mapPick=null; return push({n:'map'});
    case 'mappick': S.mapPick=p1||'now'; S.mapPin=null; S.sheets=[]; S.pickRoad=(S.mapPick==='draft'&&S.draft?S.draft.road:S.currentRoad);
      if (topR().n!=='map') push({n:'map'}); else render();
      setTimeout(()=>{ if(MAP){ MAP.off('move',onMapMove); MAP.on('move',onMapMove); onMapMove(); } },120);
      return;
    case 'mapcancel': S.mapPick=null; if(topR().n==='map'&&S.stack.length>1) return pop(); return render();
    case 'mapuse': {
      const id=S.pickRoad||S.currentRoad, r=road(id); r.added=true;
      if (S.mapPick==='draft'){ S.draft.road=id; S.mapPick=null; pop(); toast('Pin goes on '+r.name+'.'); return; }
      S.currentRoad=id; r.lastOpened=S.now; S.mapPick=null; pop(); toast('Now on '+r.name+'.'); return; }
    case 'story': S.story=+(p1||0); return push({n:'story'});
    case 'storystep': { const items=storyItems(); let n=(S.story||0)+ +p1;
      if (n<0) n=0; if (n>items.length-1){ return pop(); }
      S.story=n; return render(); }
    case 'storyclose': return pop();
    case 'mapstep': return stepMap(+p1);
    case 'pinmap': S.mapPick=null; S.mapPin=p1; push({n:'map'});
      setTimeout(()=>{ if(MAP){ const p=pin(S.mapPin); MAP.setView(pinXY(p),17); } },200); return;
    case 'roadcfg': S.roadDraft=null; return push({n:'roadcfg', id:p1});
    case 'roadlabel': S.roadDraft.label = (p1==='None'?'':p1); return render();
    case 'roadpulse': S.roadDraft.pinned = !S.roadDraft.pinned; return render();
    case 'roadsave': {
      const r=road(p1), d=S.roadDraft;
      r.address=d.address||r.address; r.label=d.label; r.added=true;
      if (d.pinned && !r.pinned && S.roads.filter(x=>x.pinned).length>=4){ return openSheet({n:'swap', id:p1}); }
      r.pinned=d.pinned; S.roadDraft=null; pop(); toast(r.name+' saved.'); return; }
    case 'roadnow': {
      const r=road(p1), d=S.roadDraft;
      r.address=d.address||r.address; r.label=d.label; r.added=true; r.pinned=d.pinned||r.pinned;
      S.currentRoad=p1; r.lastOpened=S.now; S.roadDraft=null; pop(); toast('Now on '+r.name+'.'); return; }
    case 'roadremove': {
      const r=road(p1); r.added=false; r.pinned=false;
      if (S.currentRoad===p1) S.currentRoad = (S.roads.find(x=>x.pinned)||S.roads[0]).id;
      S.roadDraft=null; pop(); toast('Removed. What was said there stays.'); return; }
    case 'postingas': if(S.draft.issue) return; return openSheet({n:'named'});
    case 'setnamed': S.draft.named = p1==='1'; S.sheets.pop(); return render();
    case 'focuscomment': { const el=document.getElementById('commentbox'); if(el){el.scrollIntoView({block:'center'});el.focus();} return; }
    case 'setnow': { const r=road(p1); S.currentRoad=p1; r.lastOpened=S.now; render(); return toast('Now on '+r.name+'.'); }
    case 'detect': {
      if (S.detecting) return;
      S.detecting=true; render();
      setTimeout(()=>{ S.detecting=false;
        if (S.force==='denied'||S.force==='nomatch'){ toast('Location did not answer. Pick a road below.'); }
        else { S.currentRoad='waterfield'; road('waterfield').lastOpened=S.now; toast('Now on Waterfield Road.'); }
        render(); }, 1400);
      return; }
    case 'authmode': S.auth_mode=p1; S.auth_err=''; return render();
    case 'sendcode': {
      const known = S.auth_phone.replace(/\D/g,'')==='9867041122';
      if (S.auth_mode==='in' && !known){ S.auth_err='No account on that number. Sign up instead.'; return render(); }
      if (S.auth_mode==='up' && known){ S.auth_err='That number already has an account. Sign in instead.'; return render(); }
      S.auth_err=''; return push({n:'auth', which:'code'}); }
    case 'checkcode':
      if (S.auth_code==='000000'){ S.auth_err='That code did not match.'; return render(); }
      if (S.auth_mode==='in'){ return finishPhone(); }
      return push({n:'auth', which:'roads'});
    case 'pickr': { const i=S.auth_roads.indexOf(p1);
      if (i>=0) S.auth_roads.splice(i,1); else if (S.auth_roads.length<4) S.auth_roads.push(p1);
      return render(); }
    case 'saveroads': return push({n:'auth', which:'name'});
    case 'finishauth': return finishPhone();

    /* roads */
    case 'pinroad': return pinRoad(p1);
    case 'addr': road(p1).added=true; return render();
    case 'unpin': road(p1).pinned=false; return render();
    case 'requestroad': S.stack.pop(); toast('Asked for “'+(S.roadq||'')+'”. We will tell you when it is on.'); return render();
    case 'askroad': toast('Asked the road about “'+(S.q||'')+'”.'); return;
    case 'swapout': S.swapPick=p2; return render();
    case 'swapdo': { const out=road(S.swapPick); out.pinned=false; road(p1).pinned=true; S.swapPick=null; S.sheets=[]; return render(); }

    /* composer */
    case 'compose': if(!gate(()=>act('compose'), 'A new pin')) return;
      S.draft=newDraft(S.currentRoad||S.roads.find(r=>r.pinned).id);
      S.stack.push({n:'composer'}); openSheet({n:'roadpick'}); return;
    case 'draftroad': S.draft.road=p1; return closeSheet();
    case 'cclose': return draftTitle(S.draft)||S.draft.photos.length ? openSheet({n:'discard'}) : (S.draft=null, pop());
    case 'discardyes': S.draft=null; S.sheets=[]; return pop();
    case 'sw': return toggleSwitch(p1);
    case 'clearyes': S.draft.date=null; S.draft.price=null; S.draft.poll=null; S.sheets=[];
      return setIssue(true);
    case 'type': S.draft.type = S.draft.type===p1?null:p1; return render();
    case 'chip': return openChip(p1);
    case 'rm': if(p1==='date') S.draft.dateEnd=null; S.draft[p1==='photos'?'photos':p1] = p1==='photos'?[]:null; return render();
    case 'post': return postPin();

    /* sheets: date */
    case 'calmon': { const d=S.dateSheet; d.m+= +p1; if(d.m<0){d.m=11;d.y--;} if(d.m>11){d.m=0;d.y++;} return render(); }
    case 'calwhich': S.dateSheet.which=p1; return render();
    case 'calday': { const d=S.dateSheet, w=d.which||'start'; d[w]=d[w]||{}; d[w].day=+p1; return render(); }
    case 'caltime': { const d=S.dateSheet, w=d.which||'start'; d[w]=d[w]||{}; d[w].time=p1; return render(); }
    case 'caladd': {
      const d=S.dateSheet;
      const HM={'7:00 am':[7,0],'7:30 am':[7,30],'8:00 am':[8,0],'9:00 am':[9,0],'6:00 pm':[18,0],'9:00 pm':[21,0],'Other':[19,0]};
      const at = k => { const v=d[k]; if(!v||!v.day) return null; const hm=HM[v.time||'7:30 am']; return new Date(d.y,d.m,v.day,hm[0],hm[1]).getTime(); };
      if (d.for==='poll'){ S.pollSheet.opens=at('open'); S.pollSheet.closes=at('close'); S.sheets.pop(); return render(); }
      S.draft.date=at('start'); S.draft.dateEnd=at('end'); S.sheets=[]; return render(); }
    /* price */
    case 'pricenote': S.priceSheet.note = S.priceSheet.note===p1?null:p1; return render();
    case 'priceadd': { const p=S.priceSheet; const n=parseInt((p.v||'').replace(/\D/g,''),10);
      S.draft.price = n ? {value:n, note:p.note?p.note.toLowerCase():null} : {value:null, note:p.note};
      S.sheets=[]; return render(); }
    /* poll */
    case 'pollwhen': {
      const base=new Date(S.now);
      const put = t => { if(!t) return {time:'9:00 pm'}; const x=new Date(t); return {day:x.getDate(), time:fmtTime(t)}; };
      S.dateSheet={y:base.getFullYear(), m:base.getMonth(), which:p1, for:'poll',
        open:put(S.pollSheet.opens), close:put(S.pollSheet.closes)};
      return openSheet({n:'date'}); }
    case 'polladd': S.pollSheet.options.push(''); return render();
    case 'pollrm': S.pollSheet.options.splice(+p1,1); return render();
    case 'pollclose': S.pollSheet.closes = S.pollSheet.closes ? null : S.now+7*DAY; return render();
    case 'polladdblock': { const p=S.pollSheet;
      S.draft.poll={q:p.q.trim(), options:p.options.filter(o=>o.trim()).map(t=>({text:t.trim(),count:0})), opens:p.opens, closes:p.closes, mine:null};
      S.sheets=[]; return render(); }
    /* photo */
    case 'photopick': { const src=LIB[+p1]; const i=S.draft.photos.indexOf(src);
      if (i<0 && S.force==='photofail'){ S.sheets=[];
        toast('That photo did not upload. Everything else is still here.', {label:'Try again', fn:()=>openSheet({n:'photo'})});
        return; }
      if (i>=0) S.draft.photos.splice(i,1); else S.draft.photos.push(src); return render(); }
    case 'photobig': return toast('That photo is over the 10 MB limit. Nothing else was touched.');
    case 'q': S.q=''; return render();
  }
}

function toggleSwitch(k){
  const d = S.draft;
  if (k==='named'){ if (d.issue) return toast('A report always carries your name.'); d.named=!d.named; return render(); }
  if (k==='event'){
    if (d.issue) return toast('Turn the report off first. Only one can be on.');
    d.event=!d.event; return render();
  }
  if (k==='issue'){
    if (d.issue) { d.issue=false; return render(); }        // turning it off: cleared blocks do not come back
    if (d.date||d.price||d.poll) return openSheet({n:'clearblocks'});
    return setIssue(true);
  }
}
function setIssue(on){
  const d = S.draft;
  d.issue = on; d.event = false; d.named = true;
  render();
  if (on && !d.photos.length) openSheet({n:'photo'});           // the photo sheet opens by itself
}
function openChip(k){
  const d = S.draft;
  if (k==='road') return openSheet({n:'roadpick'});
  if (d.issue && k!=='photo') return;                       // the other three chips do not respond
  if (k==='photo') return openSheet({n:'photo'});
  if (k==='date'){ const base = d.date?new Date(d.date):new Date(S.now);
    const put = t => { if(!t) return null; const x=new Date(t); return {day:x.getDate(), time:fmtTime(t)}; };
    S.dateSheet={y:base.getFullYear(), m:base.getMonth(), which:'start', for:'event',
      start:put(d.date)||{time:'7:30 am'}, end:put(d.dateEnd)||{time:'7:30 am'}};
    return openSheet({n:'date'}); }
  if (k==='price'){ S.priceSheet={v:d.price&&d.price.value?String(d.price.value):'', note:d.price?d.price.note:null};
    return openSheet({n:'price'}); }
  if (k==='poll'){ S.pollSheet=d.poll?{q:d.poll.q, options:d.poll.options.map(o=>o.text), closes:d.poll.closes, opens:d.poll.opens}
                                     :{q:'', options:['',''], closes:null, opens:null};
    S.pollSheet.opens = d.poll?d.poll.opens:null;
    return openSheet({n:'poll'}); }
}
function postPin(){
  const d = S.draft; const [ok] = draftValid(d); if (!ok) return;
  const lines = d.text.split('\n');
  const p = {
    id:'p'+S.now+Math.floor(Math.random()*999), road:d.road, spot:d.landmark||null,
    author:'me', anon: !d.named && !d.issue, created:S.now,
    title:lines[0].trim(), text:lines.slice(1).join('\n').trim() || '',
    photos:d.photos.slice(), price:d.price, poll:d.poll,
    supports:0, supported:false, replyBase:0,
    kind: d.issue?'issue' : d.event?'event' : 'plain',
  };
  if (d.event){ p.date=d.date; p.interested=0; p.interestedByMe=false; }
  if (d.issue){
    p.complaintType=d.type; p.landmark=d.landmark; p.ward={ack:0,prog:0,done:0}; p.wardLast=0;
    if (S.offline)           { p.sendState='filed'; p.failReason='offline'; p.grievance=null; }
    else if (S.force==='ward'){ p.sendState='filed'; p.failReason='ward';    p.grievance=null; }
    else                     { p.sendState='sent';  p.grievance=String(4400+Math.floor(Math.random()*99)); }
  }
  S.pins.push(p);
  const wasIssue = d.issue, filed = d.issue && p.sendState==='filed';
  S.draft=null; S.sheets=[]; S.stack=[{n:'tabs'}]; S.tab='explore';
  render();
  push({n:'pin', id:p.id});
  if (filed) toast(p.failReason==='ward'
    ? 'H West ward, MCGM did not answer. Your pin is here, nothing has been filed.'
    : 'No signal. Your pin is here and nothing has been sent.', {label:'Send it now', fn:()=>retrySend(p.id)});
  else if (wasIssue) toast('Filed with H West ward. Grievance '+p.grievance+'.');
}
function finishPhone(){
  S.auth='phone'; S.reads=0;
  if (S.auth_mode==='up'){
    P.me.name = (S.auth_name||'Dev D').trim();
    S.roads.forEach(r=>{ r.pinned=false; });
    S.auth_roads.slice(0,4).forEach(id=>{ const r=road(id); r.pinned=true; r.added=true; });
  }
  if (!S.currentRoad) S.currentRoad = S.auth_roads[0];
  S.stack=[{n:'tabs'}]; S.sheets=[];
  if (!S.intent) S.tab='home';
  render();
  runIntent();                        // land back on the same pin with the action applied
}

/* ── location ────────────────────────────────────────────────────────── */
function startLocate(){
  clearTimeout(S.locTimer);
  S.locResolved=false; S.loc='asking'; render();
  const mode = S.locMode||'granted';
  if (mode==='denied'){ setTimeout(()=>{ S.loc='denied'; render(); }, 900); return; }
  if (mode==='timeout'){ S.locTimer=setTimeout(()=>{ S.loc='timeout'; render(); }, 8000); return; }
  if (mode==='nomatch'){ setTimeout(()=>{ S.loc='nomatch'; render(); }, 1200); return; }
  setTimeout(()=>{ S.loc='granted'; S.locResolved=true; S.currentRoad='waterfield'; render(); }, 1200);
}

/* ── developer panel ─────────────────────────────────────────────────── */
function renderDev(){
  const openPin = topR().n==='pin' ? topR().id : 'pothole';
  const b = (act,label,on) => `<button data-d="${act}" class="${on?'on':''}">${label}</button>`;
  document.getElementById('devPanel').innerHTML = `
    <div class="grab"></div>
    <div id="devHead"><h4>Master control</h4>${b('devclose','Close')}</div>
    <div class="st">${new Date(S.now).toDateString()}<br>
      auth <b>${S.auth}</b> · location <b>${S.loc}</b> · road <b>${S.currentRoad?road(S.currentRoad).name:'none'}</b><br>
      network <b>${S.offline?'off':'on'}</b>${S.force?` · forcing <b>${S.force}</b>`:''}</div>
    <div class="g"><b>Time</b>${b('day1','+1 day')}${b('day7','+7 days')}${b('day30','+30 days')}</div>
    <div class="g"><b>Ward acts on ${esc(pin(openPin)?pin(openPin).title.slice(0,22):'')}…</b>
      ${b('w:ack','Acknowledge')}${b('w:prog','In progress')}${b('w:done','Marked done')}</div>
    <div class="g"><b>Session</b>${b('signout','Sign out')}${b('phone','Sign in as Dev D')}</div>
    <div class="g"><b>Network</b>${b('net','Network '+(S.offline?'off':'on'), S.offline)}</div>
    <div class="g"><b>Force an error</b>
      ${b('f:ward','Ward unreachable', S.force==='ward')}
      ${b('f:votefail','Answer fails to sync', S.force==='votefail')}
      ${b('f:photofail','Photo upload fails', S.force==='photofail')}
      ${b('f:none','Clear', !S.force)}</div>
    <div class="g"><b>Location on next launch</b>
      ${b('l:granted','Granted', (S.locMode||'granted')==='granted')}
      ${b('l:denied','Denied', S.locMode==='denied')}
      ${b('l:timeout','No fix, 8s', S.locMode==='timeout')}
      ${b('l:nomatch','No road matches', S.locMode==='nomatch')}
      ${b('relaunch','Relaunch')}</div>
    <div class="g"><b>Answers on the open pin</b>
      ${b('a:fixed','+1 fixed')}${b('a:notfixed','+1 not fixed')}${b('a:clear','Clear the round')}
      <div class="st" style="margin-top:6px">${(()=>{const p=pin(openPin); if(!p||p.kind!=='issue')return 'not a civic pin';
        const s=split(p); return `${s.fixed} fixed / ${s.not} not fixed of ${s.n} · ${STATE_WORD[civicState(p)]}${voteOpen(p)?' · vote open':' · vote closed'}`;})()}</div></div>`;
}
document.getElementById('dev').addEventListener('click', e=>{
  if (e.target.id==='dev'){ devOpen(false); return; }
  const el = e.target.closest('[data-d]'); if (!el) return;
  if (el.dataset.d==='devclose'){ devOpen(false); return; }
  const [c,arg] = el.dataset.d.split(':');
  const openPin = topR().n==='pin' ? topR().id : 'pothole';
  if (c==='day1') advance(1);
  if (c==='day7') advance(7);
  if (c==='day30') advance(30);
  if (c==='w') wardAct(openPin, arg);
  if (c==='signout'){ S.auth='out'; S.stack=[{n:'tabs'}]; S.sheets=[]; render(); }
  if (c==='phone'){ S.auth='phone'; render(); }
  if (c==='net'){ S.offline=!S.offline; if(!S.offline) reconcile(); render(); }
  if (c==='f'){ S.force = arg==='none'?null:arg; render(); }
  if (c==='l'){ S.locMode=arg; render(); }
  if (c==='relaunch'){ S.stack=[{n:'tabs'}]; S.sheets=[]; startLocate(); }
  if (c==='a'){
    const p = pin(openPin);
    if (arg==='clear') S.answers = S.answers.filter(x=>!(x.pinId===p.id && x.at>=(p.wardLast||0)));
    else S.answers.push({pinId:p.id, userId:'d'+S.answers.length, value:arg, at:S.now, road:S.currentRoad, pending:false});
    render();
  }
});

/* the master control opens from the tab on the right edge */
function devOpen(on){ document.getElementById('dev').classList.toggle('on', on); if (on) renderDev(); }
(function(){
  const tab=document.getElementById('cc');
  tab.addEventListener('click', ()=>{
    const el=document.getElementById('dev');
    devOpen(!el.classList.contains('on'));
    if (navigator.vibrate) navigator.vibrate(8);
  });
  document.addEventListener('keydown', e=>{
    if (e.key==='d' && !/input|textarea/i.test(e.target.tagName||'')) devOpen(!document.getElementById('dev').classList.contains('on'));
  });
})();

startLocate();
setTimeout(()=>{ if (!S.toast) toast('Pull the tab on the right for the master control.'); }, 2600);

</script>
