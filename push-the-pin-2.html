<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push the pin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F0F0ED; --surf:#FFFFFF; --ink:#111111; --ink7:#42423F; --ink5:#7B7B76;
  --rail:#E9E9E5; --civic:#FF5A00; --gather:#A59BFF; --sale:#FFC107; --ask:#7CB342;
  --green:#3B7D2A; --red:#C62828; --amber:#E08700; --inactive:#2A2A2A;
  --line:rgba(17,17,17,.10); --line2:rgba(17,17,17,.14);
  --r:8px; --pad:18px; --nav:87px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#phone,#phone *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#phone input,#phone textarea{-webkit-user-select:text;user-select:text}
#phone [data-t],#phone [data-who],#phone [data-swap],#phone [data-sup],#phone [data-vote],#phone [data-pin],
#phone .item,#phone .who,#phone .trow,#phone .majority,#phone .dim,#phone .block,#phone .rowlink,
#phone .chip,#phone .tile,#phone .zone,#phone .scard,#phone .card{cursor:pointer}
html,body{margin:0;padding:0;height:100%}
body{background:#C9C9C4;font-family:Onest,system-ui,sans-serif;color:var(--ink);letter-spacing:-.2px;
  display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;text-align:left}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;outline:none;width:100%;resize:none}
img{display:block;width:100%;height:100%;object-fit:cover;background:var(--rail)}
.hide{display:none !important}

#phone{position:relative;width:390px;height:844px;background:var(--ground);overflow:hidden;flex:0 0 auto;
  box-shadow:0 24px 60px rgba(0,0,0,.28)}
@media (max-width:760px),(max-height:900px){
  html,body{position:fixed;inset:0;overflow:hidden}
  body{padding:0;display:block}
  #phone{position:absolute;inset:0;width:100%;height:100%;box-shadow:none}
}
#view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:0 var(--pad);padding-bottom:calc(var(--nav) + 24px)}
.scroll.bar{padding-bottom:calc(var(--nav) + 86px)}
.statusbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px}
.statusbar b{font-size:15px;font-weight:700;letter-spacing:-.3px}
.statusbar .g{display:flex;align-items:flex-end;gap:7px}
.statusbar .g i{display:block;background:var(--ink)}
.statusbar.light b{color:#fff} .statusbar.light .g i{background:#fff}

h1{font-size:34px;line-height:37px;letter-spacing:-1.4px;font-weight:700;margin:6px 0 0}
h1.det{font-size:32px;line-height:34px}
h2{font-size:26px;line-height:30px;letter-spacing:-1px;font-weight:700;margin:0}
h3{font-size:19px;line-height:24px;letter-spacing:-.5px;font-weight:700;margin:0}
.sub{font-size:13px;line-height:18px;color:var(--ink5)}
.micro{font-size:12px;line-height:17px;color:var(--ink5)}
.body{font-size:15px;line-height:21px;color:var(--ink7)}
.mid{font-size:14px;line-height:20px;color:var(--ink7)}

.head{flex:0 0 auto;padding:12px var(--pad);display:flex;align-items:flex-start;gap:10px}
.head .rd{flex:1;min-width:0}
.head .rd b{display:flex;align-items:center;gap:6px;font-size:22px;line-height:26px;letter-spacing:-.8px}
.head .rd span,.head .rd em{display:block;font-size:13px;line-height:18px;color:var(--ink5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;background:var(--surf);border:1px solid var(--line)}
.sq.solid{background:var(--ink);border-color:var(--ink)}
.sq.sm{width:34px;height:34px}
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:0 0 auto}

.chips{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);
  font-size:13px;font-weight:600;letter-spacing:0;white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.fill{background:var(--rail);border-color:transparent}
.chip.fill.on{background:var(--ink);color:#fff}
.chip.dash{border-style:dashed;background:var(--ground);border-color:rgba(17,17,17,.28)}
.chip[disabled]{opacity:.4}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.card .top{display:flex;align-items:center;gap:10px;height:32px;padding-right:16px}
.card .top .rule{flex:1;height:1px;background:var(--line)}
.card .top .t{font-size:13px;color:var(--ink5)}
.card .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.road{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink7)}
.tag{height:20px;padding:0 7px;display:inline-flex;align-items:center;background:var(--sale);font-size:11px;font-weight:700;letter-spacing:0;flex:0 0 auto}
.tag.plain{background:var(--rail)}
.title{font-size:24px;line-height:26px;letter-spacing:-.8px;font-weight:700}
.by{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px}
.by .f{width:22px;height:22px;border-radius:50%;overflow:hidden;background:var(--rail);flex:0 0 auto}
.by b{font-weight:700}
.verified{height:22px;padding:0 8px 0 6px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  font-size:11px;font-weight:600;letter-spacing:0;margin-left:auto;flex:0 0 auto}
.photo{aspect-ratio:16/9;border-radius:4px;overflow:hidden}
.photo.sq{aspect-ratio:1/1}
.when{height:34px;padding:0 14px 0 10px;display:inline-flex;align-items:center;gap:8px;background:var(--gather);
  font-size:14px;font-weight:700;align-self:flex-start}
.price{height:38px;padding:0 14px 0 12px;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;align-self:flex-start}
.price b{font-size:17px}
.poll{display:flex;flex-direction:column;gap:8px}
.poll .o{height:44px;border:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;font-size:14px;font-weight:600;position:relative;overflow:hidden}
.poll .o .fillbar{position:absolute;left:0;top:0;bottom:0;background:var(--rail);z-index:0}
.poll .o span{position:relative;z-index:1}
.poll .o .n{margin-left:auto;position:relative;z-index:1;color:var(--ink5)}

/* markers */
.lrail{display:flex;align-items:center}
.lrail i.link{flex:1;height:1px;background:var(--line2)}
.mk{width:28px;height:28px;display:grid;place-items:center;flex:0 0 auto}
.lrail.big .mk{width:42px;height:42px}
.mk.none{background:var(--rail);border:1px dashed rgba(17,17,17,.35)}
.mk.start{background:var(--surf);border:2px solid var(--sale)}
.mk.done{background:var(--green)}
.mk.alert{background:var(--red)}
.llabels{display:flex;margin-top:12px}
.llabels div{flex:1;font-size:13px;line-height:18px;font-weight:700}
.llabels div em{display:block;font-style:normal;font-size:12px;line-height:16px;font-weight:400;color:var(--ink5)}
.llabels div:nth-child(2){text-align:center}
.llabels div:nth-child(3){text-align:right}

.counts{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center}
.cbtn{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700}
.cbtn .ib{width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto}
.cbtn.fx .ib{background:var(--green)} .cbtn.nfx .ib{background:var(--red)}
.cbtn.on{color:var(--civic)}
.gapx{width:14px;flex:0 0 auto} .grow{flex:1}
.majority{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px}
.majority b{font-weight:700}
.majority em{font-style:normal;color:var(--ink7)}
.majority.inert{color:var(--ink5)}

.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.rowlink{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);min-height:54px;padding:10px 16px;display:flex;align-items:center;gap:8px;width:100%;font-size:16px;font-weight:700;margin-bottom:12px}
.rowlink .n{margin-left:auto;color:var(--ink5);font-weight:700;font-size:15px}
.hr{height:1px;background:var(--line)}
.reply{display:flex;gap:12px}
.reply .f{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--rail);flex:0 0 auto}
.reply .c b{font-size:14px;line-height:20px;font-weight:700}
.reply .c em{font-style:normal;font-size:12px;color:var(--ink5);margin-left:8px}
.reply .c p{margin:4px 0 0;font-size:14px;line-height:20px;color:var(--ink7)}

.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:8px 18px;background:var(--ink);color:#fff;font-size:16px;font-weight:700}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line2)}
.btn.civic{background:var(--civic)}
.btn.full{width:100%}
.btn[disabled]{opacity:.35;cursor:default}
.btn.sm{font-size:15px;padding:8px 16px}

.vote{display:flex;align-items:stretch;border:1px solid var(--line2);background:var(--surf)}
.vote .ib{width:37px;display:grid;place-items:center;flex:0 0 auto}
.vote.fx .ib{background:var(--green)} .vote.nfx .ib{background:var(--red)}
.vote .lb{padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;white-space:nowrap}
.vote .lb .n{color:var(--ink5)}
.vote.on{background:var(--ink);border-color:var(--ink);color:#fff}
.vote.on .lb .n{color:#fff}

.actionbar{position:absolute;left:0;right:0;bottom:var(--nav);background:var(--ground);border-top:1px solid var(--line);
  padding:12px var(--pad);display:flex;align-items:center;gap:10px;z-index:5}
.iconcount{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700}
.iconcount.on{color:var(--civic)}

.nav{position:absolute;left:0;right:0;bottom:0;height:var(--nav);background:var(--ink);padding:12px var(--pad) 40px;
  display:flex;align-items:flex-start;gap:8px;z-index:6}
.nav button{height:35px;display:flex;align-items:center;background:var(--inactive);flex:0 0 auto;overflow:hidden}
.nav button .ic{width:34px;height:35px;display:grid;place-items:center;flex:0 0 auto}
.nav button b{font-size:15px;font-weight:700;max-width:0;opacity:0;white-space:nowrap;overflow:hidden;padding:0;
  transition:max-width .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease,padding .26s cubic-bezier(.2,.8,.2,1)}
.nav button.on{background:#fff;animation:navgrow .3s cubic-bezier(.2,.8,.2,1)}
.nav button.on b{max-width:120px;opacity:1;padding:0 13px 0 2px}
@keyframes navgrow{from{max-width:36px}to{max-width:190px}}
.nav .create{background:var(--surf);border:2px solid var(--civic);width:35px;height:35px;display:grid;place-items:center;margin-left:auto;flex:0 0 auto}
.nav .sp{flex:1}
.supbar{display:flex;align-items:center;gap:10px}
.supbar b{font-size:17px;font-weight:700}
.supbar em{font-style:normal;font-size:14px;color:var(--ink5)}
.nav .hb{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.5)}

.group{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ib{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;background:var(--ground)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:flex;align-items:center;gap:8px;font-size:15px;line-height:21px;font-weight:700}
.item .tx > em{display:block;font-style:normal;font-size:12px;line-height:17px;color:var(--ink5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{font-size:12px;color:var(--ink5);flex:0 0 auto}
.eyebrow{font-size:12px;font-weight:700;color:var(--ink5);letter-spacing:.6px;margin:22px 0 10px;display:flex;align-items:center}
.eyebrow .a{margin-left:auto;font-size:13px;color:var(--ink);font-weight:700;letter-spacing:0}
.sechead{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.sechead h3{flex:1}
.sechead .n{font-size:13px;color:var(--ink5)}
.searchf{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);padding:0 14px;height:52px}
.field{background:var(--surf);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:4px}

/* notices: every error is a state in the ui */
.notice{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--surf);border:1px solid var(--line);margin-bottom:12px}
.notice.warn{border-color:var(--civic);border-width:2px}
.notice .tx{flex:1}
.notice .tx b{display:block;font-size:14px;line-height:20px;font-weight:700}
.notice .tx em{font-style:normal;font-size:13px;line-height:18px;color:var(--ink7)}
.notice .act{font-size:14px;font-weight:700;flex:0 0 auto;text-decoration:underline}
.inline{font-size:13px;line-height:18px;color:var(--civic);font-weight:600}


/* pulse */
.hero{display:flex;gap:10px;align-items:flex-end;margin-top:6px}
.hero h1{font-size:34px;line-height:36px;letter-spacing:-1.4px;font-weight:700;margin:0;flex:1}
.hero .since{font-size:14px;line-height:20px;color:var(--ink5);text-align:right;width:96px;flex:0 0 auto}
.todayrow{display:flex;align-items:center;gap:10px;margin-top:18px}
.todayrow .btn{padding:7px 14px;font-size:14px;margin-left:auto}
.tiles{display:flex;gap:10px;margin-top:16px}
.tile{flex:1;height:112px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;color:#fff;text-align:left}
.tile b{font-size:34px;line-height:37px;font-weight:700;margin-top:auto}
.tile span{font-size:12px;line-height:17px;font-weight:500}
.todayline{font-size:17px;line-height:24px;font-weight:700;letter-spacing:-.3px}
.strip{display:flex;gap:10px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.scard{width:206px;flex:0 0 auto;background:var(--surf);text-align:left;display:flex;flex-direction:column}
.scard .ph{height:168px;overflow:hidden;flex:0 0 auto}
.scard .flat{height:168px;display:grid;place-items:center;flex:0 0 auto}
.scard .stamp{display:flex;height:28px;flex:0 0 auto}
.scard .stamp i{width:28px;display:grid;place-items:center}
.scard .stamp b{background:var(--ink);color:#fff;font-size:13px;line-height:18px;font-weight:700;padding:5px 11px}
.scard .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.scard .tx b{font-size:16px;line-height:20px;font-weight:700}
.scard .tx em{font-style:normal;font-size:12px;line-height:17px;color:var(--ink5)}
.endline{font-size:13px;line-height:18px;color:var(--ink5);text-align:center;margin-top:20px}
.head.pulse .av{border-radius:0}


/* story viewer */
.storyv{position:absolute;inset:0;background:var(--ground);display:flex;flex-direction:column}
.storyv .statusbar{position:relative;z-index:3}
.storyv .sph{position:absolute;left:0;right:0;top:0;height:58%;overflow:hidden}
.storyv .sph .flat{width:100%;height:100%;display:grid;place-items:center}
.storyv .stop{position:absolute;left:0;right:0;top:58px;padding:0 var(--pad);display:flex;align-items:center;gap:10px;z-index:3}
.storyv .stop .mid{flex:1;text-align:center;color:#fff}
.storyv .stop .mid b{display:block;font-size:13px;line-height:18px;font-weight:700}
.storyv .stop .mid em{font-style:normal;font-size:12px;line-height:17px;opacity:.85}
.storyv .zone{position:absolute;top:0;bottom:300px;width:38%;z-index:2}
.storyv .zone.l{left:0} .storyv .zone.r{right:0}
.storyv .ssheet{position:absolute;left:0;right:0;bottom:0;background:var(--surf);padding:18px var(--pad) 22px;
  display:flex;flex-direction:column;gap:10px;z-index:3}
.storyv .dots{display:flex;gap:6px;align-items:center;justify-content:center;flex:1}
.storyv .dots i{width:7px;height:4px;background:rgba(17,17,17,.22)}
.storyv .dots i.on{width:26px;background:var(--ink)}

/* sheets */
.sheet{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet .dim{position:absolute;inset:0;background:rgba(17,17,17,.55)}
.sheet .pw{position:relative;max-height:88%;overflow-y:auto;background:var(--ground);padding:14px var(--pad) 26px}
.grab{width:44px;height:4px;background:rgba(17,17,17,.2);margin:0 auto 16px}
.shead{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.shead .t{flex:1}
.seg{display:flex;margin-bottom:16px}
.seg button{flex:1;height:46px;background:var(--surf);border:1px solid var(--line);font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--ink);color:#fff}
.seg button .n{color:var(--ink5)} .seg button.on .n{color:#fff}
.who{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%}
.who:last-child{border-bottom:0}
.who .f{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--rail);flex:0 0 auto}
.who .f.you{border-radius:0;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.who.me{background:var(--ground)}
.who .tx{flex:1}
.who .tx b{display:block;font-size:15px;line-height:21px}
.who .tx em{display:block;font-style:normal;font-size:12px;color:var(--ink5)}
.who.historic .tx b{color:var(--ink5)}
.rep{height:28px;padding:0 10px 0 8px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;flex:0 0 auto}

/* composer */
.comp{position:absolute;inset:0;background:var(--surf);z-index:30;display:flex;flex-direction:column}
.ctop{display:flex;align-items:center;gap:10px;padding:8px var(--pad);flex:0 0 auto}
.rdpill{height:38px;padding:0 12px;display:flex;align-items:center;gap:6px;background:var(--ground);font-size:15px;font-weight:700;max-width:112px;flex:0 1 auto}
.rdpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{flex:1;overflow-y:auto;padding:14px var(--pad) 20px;display:flex;flex-direction:column;gap:14px}
.cbody > *{flex:0 0 auto}
.ctext{font-size:20px;line-height:27px;min-height:86px;font-weight:500}
.ctext::placeholder{color:var(--ink5)}
.block{border:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:12px;position:relative}
.block .x{position:absolute;top:6px;right:6px;width:26px;height:26px;display:grid;place-items:center}
.block .tx{flex:1}
.block .tx b{display:block;font-size:15px;font-weight:700}
.trow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);background:var(--surf)}
.trow.on{border:2px solid var(--acc)}
.trow.off{opacity:.45}
.trow .tx{flex:1}
.trow .tx b{display:block;font-size:15px;font-weight:700}
.trow .tx em{display:block;font-style:normal;font-size:12px;line-height:17px;color:var(--ink5)}
.sw{width:48px;height:28px;background:var(--rail);display:flex;align-items:center;padding:3px;flex:0 0 auto}
.sw i{width:22px;height:22px;background:#fff;display:block}
.trow.on .sw{background:var(--acc);justify-content:flex-end}
.trow.lock .sw{background:var(--ink);justify-content:flex-end}
.dock{border-top:1px solid var(--line);padding:10px var(--pad);display:flex;gap:8px;overflow-x:auto;flex:0 0 auto;background:var(--surf)}
.dock::-webkit-scrollbar{display:none}
.keys{flex:0 0 auto;height:291px;background:#D3D5DA;padding:10px 3px;display:flex;flex-direction:column;gap:11px;align-items:center}
.krow{display:flex;gap:6px;justify-content:center}
.key{width:33px;height:42px;background:#fff;border-radius:5px;display:grid;place-items:center;font-size:19px}
.key.alt{background:#AEB3BE}
.key.w{width:44px} .key.sp{flex:1;min-width:120px;color:var(--ink5);font-size:14px}
.wardpanel{background:var(--civic);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}

/* calendar */
.cal .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cal .mh b{font-size:18px;letter-spacing:-.5px;flex:1}
.cal .wd,.cal .wk{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .wd span{text-align:center;font-size:12px;font-weight:700;color:var(--ink5);padding:4px 0}
.cal .wk button{height:46px;display:grid;place-items:center}
.cal .wk button i{width:40px;height:40px;display:grid;place-items:center;background:var(--surf);border:1px solid var(--line);font-style:normal;font-size:16px;font-weight:500}
.cal .wk button.on i{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.cal .wk button.dead i{background:none;border:0;color:rgba(17,17,17,.25)}
.cal .wk button.empty i{background:none;border:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid button{aspect-ratio:1/1;position:relative;overflow:hidden}
.pgrid button .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;background:var(--ink);display:grid;place-items:center}
.opt{display:flex;align-items:center;gap:10px}
.opt input{background:var(--surf);border:1px solid var(--line);height:46px;padding:0 12px}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 90px);background:var(--ink);color:#fff;
  padding:12px 18px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .18s;pointer-events:none;max-width:340px}
.toast.on{opacity:1}

/* dev panel */
#dev{position:fixed;top:0;right:0;bottom:0;width:290px;max-width:86vw;background:#1B1B1B;color:#fff;
  padding:16px 16px 40px;font-size:12px;line-height:17px;overflow-y:auto;z-index:200;
  transform:translateX(102%);transition:transform .22s ease;box-shadow:-20px 0 50px rgba(0,0,0,.35)}
#dev.open{transform:none}
#dev .dh{display:flex;align-items:center;margin-bottom:14px}
#dev .dh b{flex:1;font-size:14px}
#dev .dh button{width:32px;height:32px;padding:0;display:grid;place-items:center;margin:0}
#dev .pair{display:flex;gap:6px}
#dev .pair button{margin-top:6px}
#devhint{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;background:rgba(17,17,17,.9);color:#fff;
  padding:8px 14px;font-size:11px;z-index:150;pointer-events:none;opacity:.85}
#dev h4{margin:0 0 4px;font-size:13px;letter-spacing:0}
#dev .g{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.14)}
#dev button{display:block;width:100%;padding:7px 10px;background:#2E2E2E;color:#fff;margin-top:6px;font-size:12px;font-weight:600}
#dev button.on{background:var(--civic)}
#dev .st{color:#9A9A94;font-size:11px;line-height:16px}
#dev .st b{color:#fff}
</style>
</head>

/* ============================ the civic state machine ============================ */
const STATE_LABEL={filed:'Filed',sent:'Sent',ack:'Acknowledged',progress:'In progress',
  markeddone:'Marked done',done:'Done',notdone:'Not done'};

function pinById(id){return S.pins.find(p=>p.id===id);}
function base(p){
  if(!p.grievance)return 'filed';
  const l=p.wardLog[p.wardLog.length-1];
  return l?l.s:'sent';
}
function lastTouch(p){return p.lastWard||p.day;}
function voteOpen(p){
  if(p.kind!=='civic')return false;
  const b=base(p);
  if(b==='filed')return false;
  if(b==='markeddone')return true;
  return (S.today-lastTouch(p))>=7;
}
function live(p){const from=p.lastWard||0;return p.answers.filter(a=>a.d>=from);}
function historic(p){const from=p.lastWard||0;return p.answers.filter(a=>a.d<from);}
function tally(p){const l=live(p);const f=l.filter(a=>a.vote==='fixed').length;return {f:f,n:l.length-f,t:l.length};}
function verdict(p){
  const {f,n,t}=tally(p);
  if(t>=5&&(f/t)>=0.70)return 'done';
  if(t>=3&&(n/t)>0.5)return 'notdone';
  return null;
}
function pstate(p){
  if(p.kind!=='civic')return null;
  const b=base(p);
  if(!voteOpen(p))return b;
  return verdict(p)||b;
}
function markers(p){
  switch(pstate(p)){
    case 'filed': case 'sent': return ['start','none','none'];
    case 'ack': return ['done','none','none'];
    case 'progress': return ['done','start','none'];
    case 'markeddone': return ['done','done','none'];
    case 'done': return ['done','done','done'];
    case 'notdone': return ['done','none','alert'];
  }
  return ['none','none','none'];
}
function lastAnswerDay(p){return p.answers.length?Math.max.apply(null,p.answers.map(a=>a.d)):null;}
function dormant(p){
  if(!voteOpen(p))return false;
  const l=lastAnswerDay(p);
  return (S.today-(l||lastTouch(p)))>=30;
}
function myAnswer(p){return p.answers.find(a=>a.mine);}
function markerLabels(p){
  const st=pstate(p);
  const c=st==='filed'?['Complaint','Not sent']:['Complaint','Sent '+fshort(p.day)];
  const l=p.wardLog[p.wardLog.length-1];
  let w=['Ward','Not yet'];
  if(st==='notdone')w=['Ward','Sent again '+fshort(S.today)];
  else if(l)w=['Ward',STATE_LABEL[l.s]+' '+fshort(l.d)];
  let v=['Verification','Not yet'];
  if(st==='done')v=['Verification','Done '+fshort(lastAnswerDay(p)||S.today)];
  if(st==='notdone')v=['Verification','Not done '+fshort(lastAnswerDay(p)||S.today)];
  return [c,w,v];
}

/* ============================ permissions and pending intent ============================ */
function need(level,intent){
  if(S.tier==='phone')return true;
  S.pending=intent;
  S.sheet={t:'auth',step:'number',value:''};
  return false;
}
function runPending(){
  const i=S.pending; S.pending=null;
  if(!i)return;
  if(i.a==='vote')doVote(i.pin,i.v,true);
  if(i.a==='support')doSupport(i.pin,true);
  if(i.a==='comment'){S.view='pin';S.pinId=i.pin;toast('Signed in. Add your reply.');}
  if(i.a==='post'){S.comp=i.comp;S.view='compose';}
  if(i.a==='pinroad')doPinRoad(i.road,true);
  if(i.pin&&i.a!=='post'){S.pinId=i.pin;S.view='pin';}
}

/* ============================ actions ============================ */
function toast(t){S.toast=t;render();clearTimeout(toast._t);toast._t=setTimeout(()=>{S.toast='';render();},2200);}

function doVote(id,v,skip){
  const p=pinById(id); if(!p)return;
  if(!skip&&!need('phone',{a:'vote',pin:id,v:v}))return render();
  const mine=myAnswer(p);
  const prev=mine?mine.vote:null;
  if(mine&&mine.vote===v){p.answers=p.answers.filter(a=>!a.mine);}
  else if(mine){mine.vote=v;mine.d=S.today;}
  else p.answers.push({who:'You',vote:v,d:S.today,replies:0,mine:true,at:S.loc.road||'not recorded'});
  if(!S.net.online){
    p.held={v:v,prev:prev};
    toast('No connection. Your answer is held.');
  } else if(p.held){delete p.held;}
  render();
}
function reconcile(){
  S.pins.forEach(p=>{
    if(!p.held)return;
    if(S.force.sendFail){
      p.answers=p.answers.filter(a=>!a.mine);
      if(p.held.prev)p.answers.push({who:'You',vote:p.held.prev,d:S.today,replies:0,mine:true});
      delete p.held; p.heldFailed=true;
    } else { delete p.held; }
  });
  S.pins.forEach(p=>{
    if(p.kind==='civic'&&!p.grievance&&p.queued&&S.net.online&&S.net.ward){p.grievance=String(4500+S.pins.length);delete p.queued;delete p.failed;}
  });
}
function doSupport(id,skip){
  const p=pinById(id); if(!p)return;
  if(!skip&&!need('email',{a:'support',pin:id}))return render();
  p.sup=!p.sup; p.support+=p.sup?1:-1; render();
}
function doComment(id,text){
  const p=pinById(id);
  if(!need('email',{a:'comment',pin:id}))return render();
  if(!text.trim())return;
  p.comments.push({n:'Dev D',d:S.today,f:0,t:text.trim()});
  render();
}
function doPinRoad(name,skip){
  if(!skip&&!need('phone',{a:'pinroad',road:name}))return render();
  const r=S.roads.find(x=>x.name===name);
  const pinned=S.roads.filter(x=>x.pinned);
  if(r.pinned){r.pinned=false;render();return;}
  if(pinned.length>=4){S.sheet={t:'swap',incoming:name,chosen:null};render();return;}
  r.pinned=true;render();
}
function wardAct(s){
  const p=pinById(S.pinId)||pinById('p1');
  if(p.kind!=='civic')return;
  if(!p.grievance){toast('This pin has not reached the ward yet.');return;}
  p.wardLog.push({s:s,d:S.today});
  p.lastWard=S.today;
  render();
}

function railHTML(p,big){
  const m=markers(p),icn=['file','bank','users'];
  const col={none:'#7B7B76',start:'#E08700',done:'#fff',alert:'#fff'};
  let h='<div class="lrail'+(big?' big':'')+'">';
  m.forEach((s,i)=>{
    if(i)h+='<i class="link"></i>';
    const key=(i===2&&s==='alert')?'alert':icn[i];
    h+='<div class="mk '+s+'">'+ic(key,big?20:14,col[s],2)+'</div>';
  });
  return h+'</div>';
}
function majorityLine(p){
  if(!voteOpen(p))return '';
  const {f,n,t}=tally(p);
  if(t===0)return '<div class="majority inert">No answers yet</div>';
  if(dormant(p))return '<div class="majority inert" data-who="'+p.id+'">No answers for 30 days '+ic('chevR',14,'#7B7B76')+'</div>';
  if(t<5)return '<button class="majority" data-who="'+p.id+'"><b>'+f+'</b><em>fixed,</em> <b>'+n+'</b><em>not fixed</em><span class="grow"></span>'+ic('chevR',14,'#7B7B76')+'</button>';
  const lead=n>f?['not fixed',n]:['fixed',f];
  return '<button class="majority" data-who="'+p.id+'"><b>'+lead[1]+'</b><em>people marked '+lead[0]+'</em><span class="grow"></span>'+ic('chevR',14,'#7B7B76')+'</button>';
}
function voteButtons(p,bar){
  const {f,n}=tally(p),mine=myAnswer(p);

    ic('checkC',17,'#fff',2)+'</span><span class="lb">'+(bar?'':'Fixed')+'<span class="n">'+f+'</span></span></button>';
  const b='<button class="vote nfx'+(mine&&mine.vote==='notfixed'?' on':'')+'" data-vote="notfixed" data-pin="'+p.id+'"><span class="ib">'+
    ic('alert',17,'#fff',2)+'</span><span class="lb">'+(bar?'':'Not fixed')+'<span class="n">'+n+'</span></span></button>';
  return a+b;
}

function whenText(p){return p.when?fdate(p.when.d)+', '+p.when.t:'';}
function cardTime(p){
  const d=S.today-p.day;
  if(d<=0)return p.hrs?p.hrs+'h':'now';
  return d+'d';
}
function author(p){
  if(p.anon)return '<div class="by"><span class="f"></span><b>A neighbour</b></div>';
  if(!p.author)return '';
  let right='';
  if(p.venue)right='<span class="verified">'+ic('check',12,'#3B7D2A',2.4)+'Verified by place</span>';
  return '<div class="by"><span class="f">'+ph(FACE[p.face])+'</span><b>'+p.author+'</b>'+right+'</div>';
}
function card(p){
  const civic=p.kind==='civic';
  let h='<article class="card"><div class="top"><div class="rule"></div><div class="t">'+cardTime(p)+'</div></div><div class="in">';
  h+='<button class="road" data-open="'+p.id+'">'+p.spot+(p.mine?'<span class="tag">by you</span>':'')+'</button>';
  h+='<button class="title" data-open="'+p.id+'">'+esc(p.title)+'</button>';
  h+=author(p);
  if(p.price)h+='<div class="price"><b>'+(/^\d/.test(p.price)?'&#8377;':'')+p.price+'</b></div>';
  const cut=p.text.length>150;
  h+='<button class="body" data-open="'+p.id+'" style="text-align:left">'+esc(cut?p.text.slice(0,147)+'...':p.text)+'</button>';
  if(p.photos&&p.photos.length)h+='<div class="photo">'+ph(p.photos[0])+'</div>';
  if(p.when)h+='<div class="when">'+ic('calendar',16)+whenText(p)+'</div>';
  if(p.poll)h+=pollHTML(p);
  if(civic&&pstate(p)==='filed')h+=filedNotice(p);
  if(civic&&pstate(p)!=='filed')h+=railHTML(p);
  if(civic)h+=majorityLine(p);
  h+='<div class="counts">';
  if(civic&&voteOpen(p)){
    const {f,n}=tally(p),mine=myAnswer(p);

  h+='<span class="gapx"></span>'+ic('chevR',15,'#7B7B76');

function pulseItems(){

function storyHead(p){
  if(p.kind!=='civic')return p.title;
  const st=pstate(p), t=(p.type||'report').toLowerCase();
  const W=['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
  const f=tally(p).f, n=tally(p).n;
  if(st==='filed')return 'A '+t+' is waiting to send';
  if(st==='sent')return 'A '+t+' was sent to the ward';
  if(st==='ack')return 'A '+t+' was acknowledged';
  if(st==='progress')return 'The ward started on a '+t;
  if(st==='markeddone')return 'The ward marked a '+t+' done';
  if(st==='done')return (W[f]||f)+' neighbours confirmed a fix';
  if(st==='notdone')return (W[n]||n)+' neighbours said not fixed';
  return p.title;
}
function storyStamp(p){
  const map={event:['Gather','calendar','var(--gather)'],sale:['For sale','tag','var(--sale)'],ask:['Ask','users','var(--ask)']};

function storyCard(p){

function chart(p){
  const days=[];for(let d=p.day;d<=S.today;d++)days.push(d);
  let cf=0,cn=0;const fp=[],np=[];
  const W=322,H=140;
  days.forEach((d,i)=>{
    p.answers.forEach(a=>{if(a.d===d){a.vote==='fixed'?cf++:cn++;}});
    const x=i/(days.length-1||1)*W;
    fp.push(x+','+(H-cf/Math.max(cf+cn,1)*0));np.push(x);
  });
  const max=Math.max(cf,cn,1);
  let f2=[],n2=[];cf=0;cn=0;
  days.forEach((d,i)=>{
    p.answers.forEach(a=>{if(a.d===d){a.vote==='fixed'?cf++:cn++;}});
    const x=(i/(days.length-1||1)*W).toFixed(1);
    f2.push(x+','+(H-cf/max*(H-14)).toFixed(1));
    n2.push(x+','+(H-cn/max*(H-14)).toFixed(1));
  });
  const wx=p.wardLog.map(w=>({x:((w.d-p.day)/(days.length-1||1)*W).toFixed(1),s:w.s,d:w.d}));
  return '<div class="panel"><div style="display:flex;gap:16px">'+
    '<span style="display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700"><i style="width:18px;height:3px;background:var(--ink);display:block"></i>Not fixed</span>'+
    '<span style="display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700"><i style="width:18px;height:3px;background:var(--ink5);display:block"></i>Fixed</span>'+
    '<span style="display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700"><i style="width:18px;height:3px;background:var(--sale);display:block"></i>Ward</span></div>'+
    '<svg viewBox="0 0 322 150" style="width:100%;height:auto">'+
    '<line x1="0" y1="34" x2="322" y2="34" stroke="#111" stroke-opacity=".08"/>'+
    '<line x1="0" y1="86" x2="322" y2="86" stroke="#111" stroke-opacity=".08"/>'+
    '<line x1="0" y1="140" x2="322" y2="140" stroke="#111" stroke-opacity=".16"/>'+
    wx.map(w=>'<line x1="'+w.x+'" y1="16" x2="'+w.x+'" y2="140" stroke="#FFC107" stroke-width="2" stroke-dasharray="2 6"/>'+
      '<circle cx="'+w.x+'" cy="14" r="4.5" fill="#FFC107"/>').join('')+
    '<polyline points="'+n2.join(' ')+'" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>'+
    '<polyline points="'+f2.join(' ')+'" fill="none" stroke="#7B7B76" stroke-width="2.6" stroke-linejoin="round"/>'+
    '</svg><div style="display:flex;justify-content:space-between" class="micro"><span>'+fshort(p.day)+'</span><span>'+fshort(S.today)+'</span></div>'+
    (p.wardLog.length?'<div class="micro">'+p.wardLog.map(w=>STATE_LABEL[w.s]+' '+fshort(w.d)).join(', ')+'</div>':'')+
    '</div>';
}

     '<span class="tx"><b>'+(a.mine?'You':a.who)+'</b><em>'+fshort(a.d)+(hist?', history':'')+'</em></span>'+
     (a.replies?'<span class="rep">'+ic('msg',13)+a.replies+'</span>'+ic('chevR',14,'#7B7B76'):'')+'</button>';

  (rows.length>6?'<div class="who"><b style="font-size:15px">'+(rows.length-6)+' more</b>'+ic('chevD',15)+'</div>':'')+'</div>';
  if(t<5)inner+='<div class="micro">Raw counts. '+f+' fixed, '+n+' not fixed.</div>';
  return sheetWrap(inner);
}
function shSchedule(){

  let g='';for(let i=0;i<cells.length;i+=7){
    g+='<div class="wk">'+cells.slice(i,i+7).map(d=>{

   '<div class="wd"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>'+g+'</div>'+
   '<div class="chips" style="margin:18px 0">'+['7:30 am','12:30 pm','7:30 pm','9:00 pm'].map(t=>'<button class="chip'+(c.time===t?' on':'')+'" data-time="'+t+'">'+t+'</button>').join('')+'</div>'+

/* ============================ render ============================ */
const VIEWS={explore:vExplore,pulse:vPulse,gather:vGather,search:vSearch,pin:vPin,roads:vRoads,addroad:vAddRoad,account:vAccount};
let _skey='',_stop=0;
function render(){
  const _prev=document.querySelector('.scroll');
  const _k=S.view+'|'+S.pinId+'|'+S.tab;
  if(_prev&&_k===_skey)_stop=_prev.scrollTop; else if(_k!==_skey)_stop=0;
  let body;
  if(S.loc.status!=='granted'&&S.loc.status!=='manual')body=vLoc();
  else if(S.story!=null)body=vStory();
  else if(S.view==='compose')body=vCompose();
  else body=(VIEWS[S.view]||vExplore)();
  document.getElementById('view').innerHTML=body+sheetHTML()+
    '<div class="toast'+(S.toast?' on':'')+'">'+esc(S.toast)+'</div>';
  const _now=document.querySelector('.scroll');
  if(_now&&_stop)_now.scrollTop=_stop;
  _skey=_k;
  const q=document.getElementById('q');
  if(q){q.oninput=e=>{const c=e.target.selectionStart;S.query=e.target.value;render();
    const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(c,c);}};}
  const ct=document.getElementById('ctext');
  if(ct){ct.oninput=e=>{S.comp.text=e.target.value;const c=e.target.selectionStart;render();
    const n=document.getElementById('ctext');if(n){n.focus();n.setSelectionRange(c,c);}};}
  const clm=document.getElementById('clm');
  if(clm)clm.oninput=e=>{S.comp.landmark=e.target.value;};
  const cm=document.getElementById('cmt');
  if(cm&&S.replying)cm.focus();
  const au=document.getElementById('au');
  if(au)au.oninput=e=>{S.sheet.value=e.target.value;};
  const pv=document.getElementById('pv');
  if(pv)pv.oninput=e=>{S.sheet.v=e.target.value;};
  document.querySelectorAll('.pollopt').forEach(el=>{el.oninput=e=>{S.sheet.o[+e.target.dataset.oi]=e.target.value;};});
  renderDev();
}

/* ============================ events ============================ */
function openPin(id){S.back.push({v:S.view,p:S.pinId});S.pinId=id;S.view='pin';S.replying=false;render();}
function goBack(){
  if(S.view==='compose'){S.view=S.back.length?S.back[S.back.length-1].v:'explore';render();return;}
  const b=S.back.pop();
  if(b){S.view=b.v;S.pinId=b.p;}else{S.view=S.tab;}
  render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-view],[data-open],[data-back],[data-scope],[data-vote],[data-sup],[data-who],[data-whotab],[data-whoback],[data-person],[data-jump],[data-closesheet],[data-compose],[data-leave],[data-post],[data-chip],[data-t],[data-type],[data-pickroadfor],[data-comproad],[data-clr],[data-day],[data-month],[data-time],[data-schedok],[data-priceword],[data-priceok],[data-addopt],[data-rmopt],[data-pollok],[data-photo],[data-photook],[data-setnow],[data-pinroad],[data-unpin],[data-remove],[data-newroad],[data-request],[data-swap],[data-swapok],[data-confirm],[data-clear],[data-send],[data-reply],[data-stopreply],[data-comment],[data-focus],[data-signin],[data-signout],[data-story],[data-storystep],[data-closestory],[data-openstory],[data-auth],[data-addnumber],[data-retry],[data-pickroad],[data-retryloc],[data-int],[data-poll]');
  if(!t){ if(e.target.closest('#cbody')&&S.comp){S.comp.kb=false;render();} return; }
  const d=t.dataset;
  if(t.hasAttribute('disabled'))return;

  if(d.tab){S.tab=d.tab;S.view=d.tab;S.back=[];render();return;}
  if(d.view){S.back.push({v:S.view,p:S.pinId});S.view=d.view;render();return;}
  if(d.open){openPin(d.open);return;}
  if(d.back!==undefined){S.replying=false;goBack();return;}
  if(d.scope){S.scope=d.scope;render();return;}
  if(d.vote){doVote(d.pin,d.vote);return;}
  if(d.sup!==undefined&&d.sup){doSupport(d.sup);return;}
  if(d.int){const p=pinById(d.int);if(!need('email',{a:'support',pin:d.int}))return render();p.interested=!p.interested;render();return;}
  if(d.who){const p=pinById(d.who);if(!tally(p).t)return;S.sheet={t:'who',pin:d.who,tab:tally(p).n>tally(p).f?'notfixed':'fixed',person:null};render();return;}
  if(d.whotab){S.sheet.tab=d.whotab;S.sheet.person=null;render();return;}
  if(d.person){S.sheet.person=+d.person;render();return;}
  if(d.whoback!==undefined){S.sheet.person=null;render();return;}
  if(d.jump){S.sheet=null;S.pinId=d.jump;S.view='pin';render();
    setTimeout(()=>{const el=document.getElementById('cmt');if(el)el.scrollIntoView({block:'center'});},60);return;}
  if(d.closesheet!==undefined){
    if(S.sheet&&S.sheet.t==='photo'&&S.comp&&S.comp.issue&&!S.comp.photos.length){S.sheet=null;render();return;}
    S.sheet=null;render();return;}

  /* composer */
  if(d.compose){ if(!need('phone',{a:'post',comp:newComp()}))return render();
    S.comp=S.draft||newComp();S.back.push({v:S.view,p:S.pinId});S.view='compose';render();return;}
  if(d.leave!==undefined){
    const c=S.comp;
    const has=c&&(c.text.trim()||c.photos.length||c.date||c.price||c.poll);
    if(has){S.sheet={t:'confirm',title:'Leave this pin',body:'Your text, photos and blocks go. Nothing is saved.',ok:'Leave and lose it',cancel:'Keep writing',do:'discard'};render();return;}
    S.comp=null;goBack();return;}
  if(d.post){
    const c=S.comp;
    if(!postReady(c))return;
    const id='n'+Date.now();
    const p={id:id,kind:c.issue?'civic':(c.event?'event':(c.price?'sale':'ask')),road:c.road,
      spot:c.road+(c.landmark?', '+c.landmark:''),landmark:c.landmark,
      title:c.text.split('\n')[0].slice(0,80),text:c.text.split('\n').slice(1).join(' ').trim(),
      author:c.name?'Dev D':null,anon:!c.name,face:0,mine:true,day:S.today,photos:c.photos.slice(),
      support:0,sup:false,comments:[],answers:[],wardLog:[],lastWard:null,
      when:c.date?{d:c.date,t:c.time}:null,price:c.price,poll:c.poll?c.poll.map(x=>({t:x.t,n:0})):null,
      type:c.type,grievance:null};
    if(c.issue){
      if(S.net.online&&S.net.ward){p.grievance=String(4500+S.pins.length);}
      else {p.queued=true;p.failed=true;}
    } else if(!S.net.online){p.notSent=true;}
    S.pins.unshift(p);S.comp=null;S.draft=null;
    S.view=p.kind==='event'?'gather':'explore';S.tab=S.view;S.back=[];
    render();
    toast(c.issue?(p.grievance?'Sent. Grievance '+p.grievance:'Held. It has no number yet.'):(p.notSent?'Held until the connection is back':'Posted'));
    return;}
  if(d.chip){
    const c=S.comp;
    if(d.chip==='photo'){S.sheet={t:'photo',sel:c.photos.slice()};render();return;}
    if(c.issue)return;
    if(d.chip==='schedule'){S.sheet={t:'schedule',m:c.date&&c.date>31?1:0};render();return;}
    if(d.chip==='price'){S.sheet={t:'price',v:c.price||''};render();return;}
    if(d.chip==='poll'){S.sheet={t:'poll',o:c.poll?c.poll.map(x=>x.t):['','']};render();return;}
    return;}
  if(d.t){
    const c=S.comp;
    if(d.t==='name'){if(c.issue)return;c.name=!c.name;render();return;}
    if(d.t==='issue'){
      if(c.event)return;
      if(c.issue){c.issue=false;c.name=true;render();return;}
      if(c.date||c.price||c.poll){S.sheet={t:'confirm',title:'Turn on report',body:'The date, price and poll go. Photos stay.',ok:'Turn on and clear',cancel:'Keep them',do:'issueon'};render();return;}
      turnIssueOn();return;}
    if(d.t==='event'){
      if(c.issue)return;
      c.event=!c.event;
      if(c.event&&!c.date){S.sheet={t:'schedule',m:0};}
      render();return;}
  }
  if(d.pickroadfor){S.sheet={t:'comproad'};render();return;}
  if(d.comproad){S.comp.road=d.comproad;S.sheet=null;render();return;}
  if(d.type){S.comp.type=d.type;render();return;}
  if(d.clr){const c=S.comp;
    if(d.clr==='photos')c.photos=[];if(d.clr==='date'){c.date=null;}
    if(d.clr==='price')c.price=null;if(d.clr==='poll')c.poll=null;render();return;}
  if(d.day){S.comp.date=+d.day;render();return;}
  if(d.month!==undefined&&d.month!==''){S.sheet.m=+d.month;render();return;}
  if(d.time){S.comp.time=d.time;render();return;}
  if(d.schedok){S.sheet=null;render();return;}
  if(d.priceword){S.sheet.v=d.priceword;render();return;}
  if(d.priceok){const v=(S.sheet.v||'').trim();if(!v)return;S.comp.price=v;S.sheet=null;render();return;}
  if(d.addopt){if(S.sheet.o.length<6)S.sheet.o.push('');render();return;}
  if(d.rmopt){if(S.sheet.o.length>2)S.sheet.o.splice(+d.rmopt,1);render();return;}
  if(d.pollok){const o=S.sheet.o.map(x=>x.trim()).filter(Boolean);
    if(o.length<2)return;S.comp.poll=o.map(t=>({t:t,n:0}));S.sheet=null;render();return;}
  if(d.photo){
    if(S.force.photoBig){render();return;}
    const s=S.sheet.sel,i=s.indexOf(d.photo);
    if(i>=0)s.splice(i,1);else s.push(d.photo);
    render();return;}
  if(d.photook){
    if(S.force.photoFail){S.force.photoFail=false;toast('Upload failed once. Try again.');return;}
    S.comp.photos=S.sheet.sel.slice();S.sheet=null;render();return;}
  if(d.poll!==undefined&&d.poll){const p=pinById(d.poll);
    if(!need('email',{a:'support',pin:d.poll}))return render();
    p.poll[+d.oi].n++;render();return;}

  /* roads */
  if(d.setnow){S.loc.road=d.setnow;const r=S.roads.find(x=>x.name===d.setnow);r.opened=S.today;render();toast('Now on '+d.setnow);return;}
  if(d.pinroad){doPinRoad(d.pinroad);return;}
  if(d.unpin){const r=S.roads.find(x=>x.name===d.unpin);r.pinned=false;render();return;}
  if(d.remove){S.roads=S.roads.filter(x=>x.name!==d.remove);
    if(S.loc.road===d.remove)S.loc.road=S.roads[0].name;render();toast('Removed. What was said there stays.');return;}
  if(d.newroad){
    if(S.roads.some(r=>r.name===d.newroad))return;
    S.roads.push({name:d.newroad,label:'',addr:'Bandra West, Mumbai',pinned:false,opened:S.today});render();return;}
  if(d.request){toast('Asked for '+d.request+' to be added');return;}
  if(d.swap){S.sheet.chosen=d.swap;render();return;}
  if(d.swapok){const out=S.roads.find(r=>r.name===S.sheet.chosen);out.pinned=false;
    S.roads.find(r=>r.name===S.sheet.incoming).pinned=true;S.sheet=null;render();return;}
  if(d.confirm){
    const s=S.sheet;S.sheet=null;
    if(s.do==='discard'){S.comp=null;goBack();return;}
    if(s.do==='issueon'){const c=S.comp;c.date=null;c.price=null;c.poll=null;turnIssueOn();return;}
    render();return;}

  /* misc */
  if(d.story!==undefined&&d.story!==''){S.story=+d.story;render();return;}
  if(d.storystep){const items=pulseItems();let n=S.story+(+d.storystep);
    if(n<0)n=0; if(n>items.length-1){S.story=null;} else S.story=n; render();return;}
  if(d.closestory!==undefined){S.story=null;render();return;}
  if(d.openstory){S.story=null;openPin(d.openstory);return;}
  if(d.clear){S.query='';render();return;}
  if(d.reply){if(!need('email',{a:'comment',pin:d.reply}))return render();S.replying=true;render();
    setTimeout(()=>{const el=document.querySelector('.scroll');if(el)el.scrollTop=el.scrollHeight;},40);return;}
  if(d.stopreply!==undefined){S.replying=false;render();return;}
  if(d.comment){openPin(d.comment);
    if(need('email',{a:'comment',pin:d.comment}))S.replying=true;
    render();setTimeout(()=>{const el=document.querySelector('.scroll');if(el)el.scrollTop=el.scrollHeight;},60);return;}
  if(d.send){const el=document.getElementById('cmt');const v=el?el.value:'';
    if(v.trim()){doComment(d.send,v);S.replying=false;render();
      setTimeout(()=>{const sc=document.querySelector('.scroll');if(sc)sc.scrollTop=sc.scrollHeight;},60);}
    return;}
  if(d.focus){const el=document.getElementById(d.focus);if(el){el.scrollIntoView({block:'center'});el.focus();}return;}
  if(d.signin){S.sheet={t:'auth',step:'email',value:''};render();return;}
  if(d.addnumber){S.sheet={t:'auth',step:'number',value:''};render();return;}
  if(d.signout){S.tier=null;S.pending=null;S.view='explore';S.tab='explore';S.back=[];render();toast('Signed out. Reading still works.');return;}
  if(d.auth){
    if(d.auth==='ncode'){S.sheet.step='phonecode';render();return;}
    if(d.auth==='phonedone'){S.tier='phone';S.sheet=null;runPending();render();return;}
  }
  if(d.retry){
    const p=pinById(d.retry);
    if(S.net.online&&S.net.ward){p.grievance=String(4500+S.pins.length);delete p.queued;delete p.failed;toast('Sent. Grievance '+p.grievance);}
    else toast(S.net.online?'The ward system is still not answering':'Still no connection');
    render();return;}
  if(d.pickroad){S.loc.status='manual';S.loc.road=d.pickroad;
    if(!S.roads.some(r=>r.name===d.pickroad))S.roads.push({name:d.pickroad,label:'',addr:'Bandra West, Mumbai',pinned:true,opened:S.today});
    render();return;}
  if(d.retryloc){startLocation();return;}
});
function turnIssueOn(){
  const c=S.comp;
  c.issue=true;c.event=false;c.name=true;
  S.sheet={t:'photo',sel:c.photos.slice()};
  render();
}

/* ============================ location ============================ */
let locTimer=null;
function startLocation(){
  S.loc.status='ask';render();
  clearTimeout(locTimer);
  const wait=S.force.locTimeout?8000:900;
  locTimer=setTimeout(()=>{
    if(S.force.locDenied){S.loc.status='denied';}
    else if(S.force.locTimeout){S.loc.status='timeout';}
    else if(S.force.noMatch){S.loc.status='nomatch';}
    else {S.loc.status='granted';S.loc.road='Waterfield Road';}
    render();
  },wait);
}

/* ============================ developer panel ============================ */
function renderDev(){
  const p=pinById(S.pinId)||pinById('p1');
  const st=p&&p.kind==='civic'?pstate(p):'-';
  const tl=p&&p.kind==='civic'?tally(p):{f:0,n:0,t:0};
  document.getElementById('dev').innerHTML=
  '<div class="dh"><b>Control centre</b><button data-dev="close">'+ic('x',16,'#fff')+'</button></div>'+
  '<div class="g"><h4>Time</h4><div class="st">Today <b>'+fdate(S.today)+'</b></div>'+
   '<button data-dev="day1">Advance 1 day</button><button data-dev="day7">Advance 7 days</button></div>'+
  '<div class="g"><h4>Ward, on '+(p?p.title.slice(0,26):'')+'</h4>'+
   '<div class="st">State <b>'+(STATE_LABEL[st]||st)+'</b></div>'+
   '<button data-dev="ack">Acknowledge</button><button data-dev="progress">In progress</button>'+
   '<button data-dev="markeddone">Marked done</button></div>'+
  '<div class="g"><h4>Answers</h4>'+
   '<div class="st">live <b>'+tl.f+'</b> fixed, <b>'+tl.n+'</b> not fixed'+(tl.t?', '+Math.round(tl.f/tl.t*100)+' per cent fixed':'')+'</div>'+
   '<div class="pair"><button data-dev="f+">Fixed +1</button><button data-dev="f-">Fixed &minus;1</button></div>'+
   '<div class="pair"><button data-dev="n+">Not fixed +1</button><button data-dev="n-">Not fixed &minus;1</button></div>'+
   '<button data-dev="clearanswers">Clear all answers</button></div>'+
  '<div class="g"><h4>Session</h4><div class="st">Tier <b>'+(S.tier||'signed out')+'</b></div>'+
   '<button data-dev="tier0">Sign out</button><button data-dev="tier2">Sign in</button></div>'+
  '<div class="g"><h4>Network</h4>'+
   '<button data-dev="net" class="'+(S.net.online?'':'on')+'">'+(S.net.online?'Network is on':'Network is off')+'</button>'+
   '<button data-dev="ward" class="'+(S.net.ward?'':'on')+'">'+(S.net.ward?'Ward system is up':'Ward system is down')+'</button>'+
   '<button data-dev="recon">Reconnect and send held</button></div>'+
  '<div class="g"><h4>Force</h4>'+
   ['locDenied|Location denied','locTimeout|Location times out','noMatch|No road matches','photoFail|Photo upload fails','photoBig|Photo too large','sendFail|Held answer fails']
   .map(x=>{const k=x.split('|')[0];return '<button data-dev="f:'+k+'" class="'+(S.force[k]?'on':'')+'">'+x.split('|')[1]+'</button>';}).join('')+
   '<button data-dev="loc">Run location again</button></div>'+
  '<div class="g" style="border:0"><button data-dev="reset">Reset everything</button></div>';
}
document.getElementById('dev').addEventListener('click',e=>{
  const b=e.target.closest('[data-dev]');if(!b)return;
  const k=b.dataset.dev;
  if(k==='day1'||k==='day7'){S.today+=(k==='day1'?1:7);render();return;}
  if(k==='ack'||k==='progress'||k==='markeddone'){wardAct(k);return;}
  if(k==='tier0'){S.tier=null;S.pending=null;render();return;}
  if(k==='tier1'||k==='tier2'){S.tier='phone';render();return;}
  if(k==='net'){S.net.online=!S.net.online;if(S.net.online)reconcile();render();return;}
  if(k==='ward'){S.net.ward=!S.net.ward;render();return;}
  if(k==='recon'){S.net.online=true;reconcile();render();return;}
  if(k==='loc'){startLocation();return;}
  if(k==='reset'){location.reload();return;}
  if(k==='close'){document.getElementById('dev').classList.remove('open');return;}
  if(k[0]==='f'||k[0]==='n'){
    const p=pinById(S.pinId)||pinById('p1');
    if(!p||p.kind!=='civic')return;
    const v=k[0]==='f'?'fixed':'notfixed';
    if(k[1]==='+'){p.answers.push({who:'Someone on '+p.road,vote:v,d:S.today,replies:0});}
    else{
      const from=p.lastWard||0;
      for(let i=p.answers.length-1;i>=0;i--){const a=p.answers[i];
        if(a.vote===v&&!a.mine&&a.d>=from){p.answers.splice(i,1);break;}}
    }
    render();return;}
  if(k==='clearanswers'){const p=pinById(S.pinId)||pinById('p1');if(p&&p.kind==='civic'){p.answers=[];render();}return;}
  if(k.indexOf('f:')===0){const f=k.slice(2);S.force[f]=!S.force[f];render();return;}
});

/* ============================ control centre, long press the status bar ============================ */
(function(){
  let t=null;
  const dev=()=>document.getElementById('dev');
  function start(e){
    if(!e.target.closest('.statusbar'))return;
    clearTimeout(t);
    t=setTimeout(()=>{dev().classList.toggle('open');if(navigator.vibrate)navigator.vibrate(12);},550);
  }
  function stop(){clearTimeout(t);}
  document.addEventListener('pointerdown',start);
  ['pointerup','pointercancel','pointerleave','pointermove'].forEach(ev=>document.addEventListener(ev,stop));
  document.addEventListener('contextmenu',e=>{if(e.target.closest('.statusbar'))e.preventDefault();});
})();

/* ============================ boot ============================ */
startLocation();
render();
setTimeout(()=>{const h=document.getElementById('devhint');if(h)h.remove();},6000);

</script>
